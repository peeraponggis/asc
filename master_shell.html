<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProInventive Solar Suite - Master Shell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Kanit', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { overflow: hidden; }
        .nav-step { transition: all 0.3s ease; position: relative; }
        .nav-step::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background-color: #3b82f6; transform: scaleX(0); transition: transform 0.3s ease; }
        .nav-step.active::after { transform: scaleX(1); }
        .nav-step.active { color: #1e3a8a; font-weight: 600; background-color: #f0f9ff; }
        .nav-step.active .step-num { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        
        .workspace-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; opacity: 0; visibility: hidden; transition: opacity 0.3s ease-in-out; }
        .workspace-iframe.active { opacity: 1; visibility: visible; z-index: 10; }
        
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .floating-metrics { animation: slideUp 0.5s ease-out; backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-100 flex flex-col h-screen text-slate-800">

    <!-- 1. Top Header -->
    <header class="bg-slate-900 text-white h-14 flex items-center justify-between px-4 shrink-0 shadow-md z-30">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-br from-blue-500 to-blue-700 w-8 h-8 rounded flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-solar-panel text-white text-sm"></i>
            </div>
            <span class="font-bold text-lg tracking-wide hidden sm:block">PRO<span class="text-blue-400">INVENTIVE</span></span>
            <div class="h-6 w-px bg-slate-700 mx-2"></div>
            
            <div class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded cursor-pointer transition">
                <i class="fa-solid fa-folder-open text-amber-400 text-sm"></i>
                <span class="text-sm font-medium" id="project-name">กำลังโหลดข้อมูล...</span>
            </div>
        </div>

        <div class="flex items-center space-x-5">
            <div class="hidden md:flex items-center text-xs text-slate-300">
                <span id="save-status"><i class="fa-solid fa-cloud text-gray-400 mr-1.5"></i> ตรวจสอบข้อมูล...</span>
            </div>
            <div class="flex items-center space-x-2 border-l border-slate-700 pl-4">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-user text-slate-300"></i></div>
                <div class="hidden sm:block text-xs"><div class="font-bold" id="user-name">Engineer_01</div><div class="text-slate-400">Pro Plan</div></div>
            </div>
            <button onclick="goToDashboard()" class="text-slate-400 hover:text-red-400 ml-2 transition" title="กลับหน้าแรก">
                <i class="fa-solid fa-right-from-bracket text-lg"></i>
            </button>
        </div>
    </header>

    <!-- 2. Workflow Stepper -->
    <nav class="bg-white h-14 shadow-sm flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex h-full space-x-1 overflow-x-auto no-scrollbar w-full">
            <button onclick="switchTab('pea')" id="tab-pea" class="nav-step active flex-1 sm:flex-none flex items-center px-4 h-full text-slate-500 hover:bg-slate-50 min-w-max">
                <div class="step-num w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs font-bold mr-2">1</div>
                <span class="text-sm">Energy Profiling (PEA)</span>
            </button>
            <div class="flex items-center text-slate-300"><i class="fa-solid fa-chevron-right text-[10px]"></i></div>
            
            <button onclick="switchTab('asc')" id="tab-asc" class="nav-step flex-1 sm:flex-none flex items-center px-4 h-full text-slate-500 hover:bg-slate-50 min-w-max">
                <div class="step-num w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs font-bold mr-2">2</div>
                <span class="text-sm">System Design (ASC)</span>
            </button>
            <div class="flex items-center text-slate-300"><i class="fa-solid fa-chevron-right text-[10px]"></i></div>
            
            <button onclick="switchTab('report')" id="tab-report" class="nav-step flex-1 sm:flex-none flex items-center px-4 h-full text-slate-500 hover:bg-slate-50 min-w-max">
                <div class="step-num w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs font-bold mr-2">3</div>
                <span class="text-sm">Proposal & Report</span>
            </button>
        </div>
    </nav>

    <!-- 3. Main Workspace -->
    <main class="flex-grow relative bg-slate-200">
        <iframe id="frame-pea" src="asc_e_analysis.html" class="workspace-iframe active bg-white"></iframe>
        <iframe id="frame-asc" src="asc_design.html" class="workspace-iframe bg-white"></iframe>
        <iframe id="frame-report" src="asc_report.html" class="workspace-iframe bg-white"></iframe>
    </main>

    <!-- 4. Floating Live Metrics Bar -->
    <div id="floating-metrics" class="floating-metrics hidden absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white/95 border border-slate-200 shadow-xl rounded-full px-6 py-2 flex items-center space-x-6 z-40">
        <div class="flex items-center">
            <div class="bg-blue-100 text-blue-600 p-1.5 rounded-full mr-2"><i class="fa-solid fa-solar-panel text-xs"></i></div>
            <div class="flex flex-col">
                <span class="text-[10px] text-slate-500 font-bold uppercase leading-none">System Size</span>
                <span class="text-sm font-bold text-slate-800 leading-tight" id="live-kwp">0.00 <span class="text-xs font-normal">kWp</span></span>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ⚙️ MASTER SHELL LOGIC (ENGINE) ⚙️         -->
    <!-- ========================================== -->
    <script>
        const DB_KEY = 'proinventive_enterprise_db';
        let currentProjectId = null;
        let currentProjectData = null;

        // --- 1. การจัดการสถาปัตยกรรมข้อมูล (Data Model) & URL Params ---
        function initApp() {
            // ตรวจสอบ URL Parameter (เช่น ?id=proj_1700000001)
            const urlParams = new URLSearchParams(window.location.search);
            currentProjectId = urlParams.get('id');

            // หากไม่มี ID ระบบจะจำลองสร้าง ID ขึ้นมาใหม่ เพื่อความสะดวกในการทดสอบตอนนี้
            // (ในอนาคต โค้ดส่วนนี้จะสั่ง Redirect กลับไปหน้า Dashboard)
            if (!currentProjectId) {
                currentProjectId = 'demo_proj_' + new Date().getTime();
                window.history.replaceState(null, null, `?id=${currentProjectId}`);
                console.log("สร้างโปรเจกต์ใหม่ชั่วคราว:", currentProjectId);
            }

            loadProjectFromDB();
        }

        // --- 2. โหลด Database (จำลอง Backend Integration) ---
        function loadProjectFromDB() {
            let db = JSON.parse(localStorage.getItem(DB_KEY));
            
            // โครงสร้าง Database จำลอง
            if (!db) {
                db = { 
                    user_profile: { uid: 'u001', name: 'Admin Engineer', role: 'System Admin' }, 
                    projects: {} 
                };
            }

            // ถ้าเป็นโปรเจกต์ใหม่ ให้สร้างโครงสร้างเปล่ารอไว้
            if (!db.projects[currentProjectId]) {
                db.projects[currentProjectId] = {
                    meta: { 
                        name: "New Solar Project", 
                        createdAt: new Date().toISOString(),
                        lastModified: new Date().toISOString()
                    },
                    data: {
                        db0: null, // โหลดไฟฟ้า
                        db1: null, // แผนที่
                        db2: null, // พารามิเตอร์
                        db3: null  // รายงาน
                    }
                };
                localStorage.setItem(DB_KEY, JSON.stringify(db));
            }

            // โหลดข้อมูลใส่หน่วยความจำ
            currentProjectData = db.projects[currentProjectId].data;
            
            // อัปเดต UI
            document.getElementById('project-name').innerText = db.projects[currentProjectId].meta.name;
            document.getElementById('user-name').innerText = db.user_profile.name;
            showSaveStatus('<i class="fa-solid fa-cloud-check text-green-400 mr-1.5"></i> โหลดข้อมูลสำเร็จ');
        }

        // --- 3. บันทึก Database (Roadmap สู่ Cloud) ---
        function saveProjectToDB() {
            let db = JSON.parse(localStorage.getItem(DB_KEY));
            
            // อัปเดตข้อมูลและเวลาแก้ไข
            db.projects[currentProjectId].data = currentProjectData;
            db.projects[currentProjectId].meta.lastModified = new Date().toISOString();
            
            // *จุดนี้ในอนาคตเปลี่ยนเป็น: Firebase.firestore().collection('projects').doc(currentProjectId).set(db.projects[currentProjectId])*
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            
            showSaveStatus('<i class="fa-solid fa-cloud-check text-green-400 mr-1.5"></i> บันทึกล่าสุด: ' + new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'}) + ' น.');
        }

        // --- 4. สื่อสารกับ Iframe (Workflow Data Flow) ---
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || !data.type) return;

            let needSave = false;

            if (data.type === 'EXPORT_DB0') {
                currentProjectData.db0 = data.payload;
                needSave = true;
                console.log('📥 รับ DB0 เรียบร้อย', data.payload);
            } 
            else if (data.type === 'EXPORT_DB1_DB2') {
                currentProjectData.db1 = data.payload.db1;
                currentProjectData.db2 = data.payload.db2;
                needSave = true;
                console.log('📥 รับ DB1 & DB2 เรียบร้อย');
                
                // อัปเดต Floating Metrics แบบ Live
                if (data.payload.db1 && data.payload.db1.step4_validation_results) {
                    let kwp = data.payload.db1.step4_validation_results.totalDcCapacity_kWp;
                    document.getElementById('live-kwp').innerHTML = `${parseFloat(kwp).toFixed(2)} <span class="text-xs font-normal">kWp</span>`;
                }
            } 
            else if (data.type === 'EXPORT_DB3') {
                currentProjectData.db3 = data.payload;
                needSave = true;
                console.log('📥 รับ DB3 เรียบร้อย');
            }

            if (needSave) {
                showSaveStatus('<i class="fa-solid fa-spinner fa-spin text-blue-400 mr-1.5"></i> กำลังบันทึก...');
                saveProjectToDB();
            }
        });

        // --- 5. UI Control & Tab Switching ---
        function switchTab(tabId) {
            document.querySelectorAll('.nav-step').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            document.querySelectorAll('.workspace-iframe').forEach(frame => frame.classList.remove('active'));
            const activeFrame = document.getElementById(`frame-${tabId}`);
            activeFrame.classList.add('active');

            // จัดการ Floating Metrics
            const floatingBar = document.getElementById('floating-metrics');
            if (tabId === 'asc') {
                floatingBar.classList.remove('hidden');
                floatingBar.style.animation = 'none'; floatingBar.offsetHeight; floatingBar.style.animation = null;
            } else {
                floatingBar.classList.add('hidden');
            }

            // ** ส่งข้อมูล State ปัจจุบันไปให้ Iframe ลูกที่เพิ่งเปิด **
            activeFrame.contentWindow.postMessage({ 
                type: 'SYNC_PROJECT_STATE', 
                payload: currentProjectData 
            }, '*');
        }

        function showSaveStatus(htmlContent) {
            document.getElementById('save-status').innerHTML = htmlContent;
        }

        function goToDashboard() {
            // จำลองการกลับหน้าหลัก
            alert("เตรียมพากลับไปหน้า Project Manager Dashboard (รายชื่อโครงการทั้งหมด)");
            // window.location.href = "dashboard.html";
        }

        // Initialize เมื่อเอกสารโหลดเสร็จ
        document.addEventListener("DOMContentLoaded", initApp);
        
        // ใส่สีขาวให้ Iframe เผื่อยังไม่ได้สร้างไฟล์
        document.getElementById('frame-pea').onload = function() { try { this.contentWindow.document.body.style.backgroundColor = '#ffffff'; } catch(e){} };
    </script>
</body>
</html>
