<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บทสรุประบบ — ProInventive Solar Suite</title>
<link rel="icon" href="img/pilogo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   บทสรุประบบ (Executive Summary) — SPA เดี่ยว ไม่พึ่งไลบรารีภายนอก
   ธีมและภาษาการออกแบบยกมาจากรายงาน Villa Leelawadee (vl_solar.html)
   ข้อมูลทั้งหมดอ่านจากไฟล์ DB3 ของหน้า Proposal & Report (asc_report)
   ══════════════════════════════════════════════════════════════════ */
:root{
  --ink:#12263A; --ink-2:#3B4C5E; --mute:#7A8794;
  --paper:#F3F6F8; --card:#FFFFFF; --line:#DCE3EA;
  --sun:#E8A317; --sun-2:#F6C453; --pv:#1E5A8A; --bat:#1F8A70; --grid:#6B7A8F; --warn:#C4432B; --night:#0F1E33;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:'Kanit',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 70px}

/* ── หัวเรื่อง ─────────────────────────────────────────────────── */
header{background:var(--night);color:#fff;padding:24px 0 26px;position:relative;overflow:hidden}
header .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:0}
header h1{margin:0;font-size:clamp(22px,3.2vw,34px);font-weight:600;line-height:1.15}
header h1 small{display:block;font-weight:300;font-size:.52em;color:#B9C7D6;margin-top:6px}
.eyebrow{font-family:'Kanit';font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sun-2);margin-bottom:8px}
header::after{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(232,163,23,.35),transparent 65%);pointer-events:none}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px}
.seg button{background:transparent;border:0;color:#fff;padding:7px 16px;border-radius:999px;font-family:'Kanit';font-size:14px}
.seg button.on{background:var(--sun);color:var(--night)}
.tariff{display:flex;align-items:center;gap:8px;font-size:13px;color:#B9C7D6}
.tariff input{width:74px;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-family:'Kanit'}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 16px;font-family:'Kanit';font-size:13px}
.brand{display:flex;gap:16px;align-items:center}
.brand img.cover{width:72px;height:72px;border-radius:12px;object-fit:cover;box-shadow:0 4px 18px rgba(0,0,0,.4);flex:none}

/* ── โครงหน้า ──────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.card h2{margin:0 0 4px;font-size:20px;font-weight:600}
.card h3{margin:18px 0 8px;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.card h3:first-of-type{margin-top:6px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.badge{display:inline-block;font-family:'Kanit';font-size:12px;padding:3px 10px;border-radius:999px;background:#EAF1F7;color:var(--pv);margin-left:8px;vertical-align:middle}
.badge.ac{background:#E6F4EF;color:var(--bat)}

/* ── ตัวเลขสรุป ────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border-radius:10px;padding:10px 12px}
.stat .v{font-family:'Kanit';font-size:21px;font-weight:600;line-height:1.1}
.stat .v small{font-size:12px;font-weight:400;color:var(--mute)}
.stat .l{font-size:12px;color:var(--mute)}
.stat.hot{background:#FFF5DC}
.stat.hot .v{color:#9A6300}
.roi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.roi .stat .v{font-size:19px}
.payback{margin-top:10px;height:10px;background:var(--paper);border-radius:999px;overflow:hidden}
.payback i{display:block;height:100%;background:linear-gradient(90deg,var(--bat),var(--sun))}
.tiny{font-size:12px;color:var(--mute);margin-top:6px}

/* ── รายการอุปกรณ์ ─────────────────────────────────────────────── */
.eqlist{list-style:none;margin:0;padding:0}
.eqlist li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.eqlist li:last-child{border-bottom:0}
.eqlist svg{width:30px;height:30px;flex:none}
.eqlist b{display:block;font-family:'Kanit';font-weight:500;font-size:14.5px;line-height:1.25}
.eqlist span{font-size:13px;color:var(--ink-2)}

/* ── แผนภาพการไหลพลังงาน ───────────────────────────────────────── */
.flow svg{width:100%;height:auto;display:block}
.node-label{font-family:'Kanit';font-size:12.5px;fill:var(--ink);font-weight:500}
.node-sub{font-family:'Kanit';font-size:11px;fill:var(--mute)}
.kw{font-family:'Kanit';font-size:12px;font-weight:600}
.edge{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 8;opacity:.15;transition:opacity .3s}
.edge.on{opacity:1;animation:flow 1s linear infinite}
.edge.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.edge.on{animation:none}}

/* ── แถบเวลา 24 ชั่วโมง ────────────────────────────────────────── */
.clock{margin-top:14px;border-radius:12px;padding:14px 16px 10px;background:linear-gradient(90deg,#0F1E33 0%,#1B3A5C 20%,#8FC6EE 32%,#FFF3C9 50%,#8FC6EE 68%,#1B3A5C 80%,#0F1E33 100%);color:#fff}
.clock .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.clock .time{font-family:'Kanit';font-size:26px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.clock .state{font-family:'Kanit';font-size:13px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:999px}
.clock input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--sun)}
.clock .play{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 12px;font-family:'Kanit';font-size:13px}

/* ── กราฟ ──────────────────────────────────────────────────────── */
/* กราฟอยู่ในการ์ดของตัวเองแล้ว ไม่ได้ต่อท้ายแผนภาพ จึงไม่ต้องมีเส้นคั่นและระยะติดลบ */
.chart{margin:0;padding:0;background:transparent}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ── เสียงบรรยาย ───────────────────────────────────────────────── */
.voice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px;padding:12px 14px;border-radius:12px;background:var(--night);color:#fff}
/* ชุดปุ่มเสียงเวอร์ชันที่อยู่บนแถบหัวเรื่อง พื้นหลังเข้มอยู่แล้วจึงไม่ต้องมีกล่องซ้อน */
.voice.in-head{margin:0;padding:0;border-radius:0;background:transparent;justify-content:flex-end}
.voice.in-head button{padding:7px 16px;font-size:14px}
.voice.in-head .vs{width:100%;flex:none;text-align:right;margin-top:2px;min-width:0}
.voice button{background:var(--sun);color:var(--night);border:0;border-radius:999px;padding:9px 16px;font-family:'Kanit';font-weight:500;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.voice button.stop{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.voice .vs{font-size:12px;color:#B9C7D6;flex:1;min-width:160px}
.voice.speaking button.speak{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(232,163,23,.25)}}

/* ── ตาราง ─────────────────────────────────────────────────────── */
.compare{margin-top:22px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;color:var(--ink-2)}
thead th{font-family:'Kanit';font-weight:500;color:var(--mute);font-size:12px;letter-spacing:.06em}
tbody tr:hover{background:var(--paper)}
td.best{color:var(--bat);font-weight:600}
td.neg{color:var(--warn)}
.tscroll{overflow-x:auto;max-height:420px;overflow-y:auto}
.tscroll thead th{position:sticky;top:0;background:var(--card)}

/* ── ข้อความเสริม ──────────────────────────────────────────────── */
.flag{border-left:3px solid var(--warn);background:#FBEFEC;padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-top:8px}
.tip{border-left:3px solid var(--bat);background:#EAF6F1;padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-top:8px}
.advice{font-size:15px;list-style:none;margin:0;padding:0}
.advice li{margin:7px 0;padding-left:24px;position:relative}
.advice li::before{content:"✔";position:absolute;left:0;top:1px;color:var(--bat);font-size:13px}

/* ── หน้าเปล่า (ยังไม่มีข้อมูล) ────────────────────────────────── */
.empty{max-width:560px;margin:60px auto;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:40px 30px}
.empty h2{margin:14px 0 8px}
.empty p{color:var(--ink-2);font-size:14.5px}
.empty .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{font-family:'Kanit';border:0;border-radius:10px;padding:11px 20px;font-size:14.5px;font-weight:500}
.btn.pri{background:var(--pv);color:#fff}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.empty.drag{border-color:var(--sun);background:#FFFBEE}

/* ── หน้าต่างเลือกรูปแบบวิดีโอ ─────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(15,30,51,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:14px;max-width:480px;width:100%;padding:24px 26px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:600}
.modal .btn{width:100%;margin-top:9px;text-align:left}
.modal .tiny{margin-top:12px}

footer{margin-top:26px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
.company{display:flex;gap:12px;align-items:center;margin-bottom:10px;color:var(--ink-2)}
.company img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.company b{font-family:'Kanit';color:var(--ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

@media (max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .wrap{padding:0 12px 50px}
  header{padding:16px 0 20px}
  .card{padding:14px;border-radius:12px}
  .stats,.roi{grid-template-columns:1fr 1fr;gap:8px}
  .stat .v{font-size:17px}
  .clock .time{font-size:21px}
  table{font-size:12px}
  th,td{padding:7px 8px}
}
@media print{
  header .controls,.voice,.clock .play,#btn-print,.empty .actions{display:none !important}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <img id="cover-img" class="cover" src="img/pilogo.png" alt=""
           onerror="this.style.display='none'">
      <div>
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1><span id="proj-name">—</span><small data-i18n="subtitle"></small></h1>
      </div>
    </div>
    <div class="controls">
      <div class="tariff"><span data-i18n="tariff"></span><input id="tariff" type="number" step="0.1" min="1" value="4.2"> ฿/kWh</div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-th" class="on" onclick="setLang('th')">ไทย</button>
        <button id="lang-en" onclick="setLang('en')">English</button>
      </div>
      <button id="btn-print" class="btn-ghost" onclick="window.print()" data-i18n="print"></button>
      <button id="btn-video" class="btn-ghost" onclick="exportVideo()" data-i18n="video"></button>
      <div class="voice in-head" id="voice-box">
        <button class="speak" id="btn-speak" onclick="speak()"><span>🔊</span><span data-i18n="speak"></span></button>
        <button class="stop" onclick="stopSpeak()" data-i18n="stop"></button>
        <span class="vs" id="voice-status" data-i18n="voiceNote"></span>
      </div>
    </div>
  </div>
</header>

<!-- ยังไม่มีข้อมูล DB3 : บอกทางไปต่อให้ชัด แทนที่จะปล่อยหน้าว่าง -->
<div id="empty" class="empty" style="display:none">
  <svg viewBox="0 0 40 40" width="56" height="56"><rect x="4" y="10" width="32" height="20" rx="2" fill="#1E5A8A"/><path d="M4 17h32M4 24h32M14 10v20M25 10v20" stroke="#8FC6EE" stroke-width="1.3"/><path d="M14 30l-4 6M26 30l4 6" stroke="#3B4C5E" stroke-width="2"/></svg>
  <h2 data-i18n="emptyTitle"></h2>
  <p data-i18n="emptyBody"></p>
  <div class="actions">
    <button class="btn pri" onclick="document.getElementById('file-db3').click()" data-i18n="emptyImport"></button>
    <button id="btn-goto-report" class="btn sec" style="display:none" onclick="gotoReport()" data-i18n="emptyGoto"></button>
  </div>
  <input type="file" id="file-db3" accept=".txt,.json" style="display:none" onchange="importFile(this.files[0]); this.value='';">
  <p class="tiny" data-i18n="emptyDrop"></p>
</div>

<!-- เลือกรูปแบบการส่งออกวิดีโอ : มีเสียงบรรยาย (บันทึกหน้าจอ) หรือไม่มีเสียง -->
<div id="vid-modal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeVidModal()">
  <div class="modal">
    <h3 data-i18n="vmTitle"></h3>
    <p class="sub" data-i18n="vmBody"></p>
    <button class="btn pri" onclick="closeVidModal(); exportVideoWithVoice()" data-i18n="vmVoice"></button>
    <button class="btn sec" onclick="closeVidModal(); exportVideoSilent()" data-i18n="vmSilent"></button>
    <button class="btn sec" onclick="closeVidModal()" data-i18n="vmCancel"></button>
    <p class="tiny" data-i18n="vmHint"></p>
  </div>
</div>

<main class="wrap" id="main" style="display:none">

  <!-- แถวบน : แผนภาพการไหลอยู่ซ้าย กราฟและแถบเวลาอยู่ขวา
       วางคู่กันเพื่อให้ดูเส้นทางพลังงานกับตัวเลขในชั่วโมงเดียวกันได้พร้อมกัน -->
  <div class="grid">
    <section class="card flow">
      <h2><span data-i18n="flowT"></span><span class="badge" id="sys-badge"></span></h2>
      <p class="sub" data-i18n="flowS"></p>
      <div id="flow-svg"></div>
    </section>

    <section class="card">
      <div class="chart">
        <div id="day-chart"></div>
        <div class="legend" id="day-legend"></div>
        <p class="sub" id="load-desc" style="margin:10px 0 0"></p>
      </div>
      <div class="clock">
        <div class="row">
          <span class="time" id="clock-time">12:00</span>
          <span class="state" id="clock-state"></span>
          <button class="play" id="btn-play" onclick="togglePlay()">▶</button>
        </div>
        <input type="range" id="hour" min="0" max="23" value="12" oninput="setHour(+this.value)">
      </div>
    </section>
  </div>

  <!-- แถวกลาง : อุปกรณ์และสมรรถนะอยู่ซ้าย ความคุ้มค่าอยู่ขวา -->
  <div class="grid" style="margin-top:18px">
    <section class="card">
      <h2 data-i18n="equip"></h2>
      <p class="sub" data-i18n="equipSub"></p>
      <ul class="eqlist" id="eq-list"></ul>
      <h3 data-i18n="cap"></h3>
      <p class="sub" data-i18n="capSub" style="margin-bottom:10px"></p>
      <div class="stats" id="stat-grid"></div>
    </section>
    <section class="card">
      <h2 data-i18n="roi"></h2>
      <p class="sub" data-i18n="roiSub"></p>
      <div class="roi" id="roi-grid"></div>
      <div class="payback"><i id="pb-bar" style="width:0%"></i></div>
      <p class="tiny" id="pb-note"></p>
      <div class="tip" id="roi-tip"></div>
    </section>
  </div>

  <!-- ผลผลิตรายเดือน -->
  <section class="card compare">
    <h2 data-i18n="moTitle"></h2>
    <p class="sub" data-i18n="moSub"></p>
    <div id="month-chart"></div>
  </section>

  <!-- คำแนะนำในการตัดสินใจลงทุน -->
  <section class="card compare">
    <h2 data-i18n="advTitle"></h2>
    <p class="sub" data-i18n="advSub"></p>
    <ul class="advice" id="advice-list"></ul>
    <div id="advice-flag"></div>
    <div id="advice-tip"></div>
  </section>

  <!-- ตารางการเงิน 25 ปี -->
  <section class="card compare">
    <h2 data-i18n="finTitle"></h2>
    <p class="sub" data-i18n="finSub"></p>
    <div class="tscroll" id="fin-table"></div>
  </section>

  <footer>
    <div class="company" id="company-box" style="display:none">
      <img id="co-logo" src="" alt="" onerror="this.style.display='none'">
      <div><b id="co-name"></b><br><span id="co-addr"></span><br><span id="co-contact"></span></div>
    </div>
    <p data-i18n="footer"></p>
  </footer>
</main>

<script>
/* ══════════════════════════════════════════════════════════════════
   1) ภาษา ─ ไทย/อังกฤษ สลับได้ทั้งหน้าแบบเดียวกับรายงานตัวอย่าง
   ══════════════════════════════════════════════════════════════════ */
const I18N = {
 th:{eyebrow:'บทสรุประบบโซลาร์เซลล์ · Executive Summary',
     subtitle:'สรุปอุปกรณ์ กำลังการผลิต การไหลของพลังงาน และความคุ้มค่าจากผลจำลองรายชั่วโมง (DB3)',
     tariff:'ค่าไฟ', print:'พิมพ์ / PDF', video:'Export Video', videoBusy:'กำลังสร้างวิดีโอ… ',
     videoNo:'เบราว์เซอร์นี้ไม่รองรับการอัดวิดีโอ (MediaRecorder)',
     vmTitle:'ส่งออกวิดีโอ',

function importFile(file){
    if (!file) return;
    const r = new FileReader();
    r.onload = e => {
        try {
            const j = JSON.parse(e.target.result);
            if (!j.is_asc_db3) { alert(T().importBad); return; }
            loadDB3(j);
        } catch(err) { alert('อ่านไฟล์ไม่สำเร็จ: ' + err.message); }
    };
    r.readAsText(file);
}

/* ══════════════════════════════════════════════════════════════════
   3) แปลง DB3 → โมเดลกลาง  (ทุกช่องมีค่าสำรอง กันไฟล์รุ่นเก่า)
   ══════════════════════════════════════════════════════════════════ */
function loadDB3(db3){
    const ui = db3.ui_inputs || {};
    const st = db3.app_state || {};
    const R  = st.results || {};
    const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
    const str = v => (v == null ? '' : String(v)).trim();

    const fin = Array.isArray(st.financials) ? st.financials : [];
    const y1  = fin.find(f => f.y === 1) || {};
    const investment = fin.length ? -num(fin[0].net) : 0;

    /* หา "ปีคืนทุน" จากจุดที่เงินสะสมพลิกเป็นบวก แล้วเทียบบัญญัติไตรยางศ์ในปีนั้น */
    let payback = null;
    for (let i = 1; i < fin.length; i++) {
        if (num(fin[i].cum) >= 0) {
            const prev = num(fin[i-1].cum), step = num(fin[i].cum) - prev;
            payback = (fin[i].y - 1) + (step > 0 ? (-prev) / step : 0);
            break;
        }
    }

    const batQty = num(ui['inp-bat-qty']), batKwh = num(ui['inp-bat-kwh']);
    const daily  = (Array.isArray(st.daily8760) && st.daily8760.length === 24) ? st.daily8760 : null;

    M = {
        name: str(db3.projectName || ui['inp-proj']) || 'Solar Project',
        pnom: num(R.pnom), pr: num(R.effPR) * 100, eGrid: num(R.totalEGrid),
        dcPeak: num(db3.dcPeak), surplus: num(db3.surplusSum),
        pv:  { qty: num(ui['inp-pv-qty']), wp: num(ui['inp-pv-wp']), mfr: str(ui['pv-Manufacturer']), model: str(ui['inp-pv-model']), eff: num(ui['pv-Module_Efficiency_Pct']) },
        inv: { qty: num(ui['inv1-qty']) || 1, kw: num(ui['inp-invKw']), mfr: str(ui['inv1-Manufacturer']), model: str(ui['inp-inv-model']) },
        bat: { qty: batQty, kwh: batKwh, cap: batQty * batKwh, mfr: str(ui['bat-Manufacturer']), model: str(ui['inp-bat-model']),
               ckw: num(ui['bat-Max_Continuous_Charge_Power_kw']) * batQty,
               dkw: num(ui['bat-Max_Continuous_Discharge_Power_kw']) * batQty },
        tariff: num(ui['fin-tariff']) || 4.2,
        daily, monthly: Array.isArray(st.monthlyBalances) ? st.monthlyBalances : [],
        financials: fin, investment, payback,
        y1savings: num(y1.savings), y1energy: num(y1.energy),
        cover: (Array.isArray(st.projectImagesBase64) && st.projectImagesBase64[0]) || null,
        /* ระบบออนกริดเดิม (AC coupling) — ไซต์ที่ไม่มีจะเป็น null ทุกอย่างจึงแสดงเหมือนเดิม
           ตัวเลขผลลัพธ์อยู่ที่ระดับบนของ DB3 ส่วนสเปกอยู่ใน app_state */
        existing: st.existing ? {
            acKw: num(st.existing.acKw), invModel: str(st.existing.invModel) || '-',
            annual: num(db3.exAcSum), base: num(db3.exUsefulBase),
            delta: num(db3.usefulDelta), curtailed: num(db3.exCurtailSum)
        } : null
    };
    M.sim = simulate(M);
    document.getElementById('tariff').value = M.tariff;

    document.getElementById('empty').style.display = 'none';
    document.getElementById('main').style.display = '';
    renderAll();
}

function showEmpty(){
    document.getElementById('main').style.display = 'none';
    const em = document.getElementById('empty');
    em.style.display = '';
    document.getElementById('btn-goto-report').style.display = inShell ? '' : 'none';
}

/* ══════════════════════════════════════════════════════════════════
   4) จำลองวันเฉลี่ย 24 ชั่วโมง ─ PV/โหลดมาจากผลจำลองจริง (daily8760)
      ส่วนแบตเตอรี่จำลองการชาร์จ/คายซ้ำด้วยสเปกจริงจาก DB3
   ══════════════════════════════════════════════════════════════════ */
function simulate(m){
    const rows = [];
    let soc = m.bat.cap * 0.25;                       // เริ่มวันที่ 25% ตามเงื่อนไข minSoC ของหน้ารายงาน
    const cLim = m.bat.ckw > 0 ? m.bat.ckw : m.inv.kw;
    const dLim = m.bat.dkw > 0 ? m.bat.dkw : m.inv.kw;
    for (let h = 0; h < 24; h++) {
        let pv, load, ex = 0;
        if (m.daily) { pv = m.daily[h].pv || 0; load = m.daily[h].load || 0; ex = m.daily[h].ex || 0; }
        else {        // ไม่มี daily8760 (ไฟล์รุ่นเก่า) ใช้เส้นโค้งมาตรฐานจากยอดสูงสุด
            const s = Math.sin(Math.PI * (h - 6) / 12);
            pv = (h >= 6 && h <= 18) ? m.dcPeak * Math.pow(Math.max(0, s), 1.3) : 0;
            load = m.eGrid / 365 / 12;
        }
        /* ไซต์ที่ต่อพ่วงระบบเดิมทางฝั่ง AC แบตเตอรี่ทำงานกับกำลังรวมของทั้งบัส
           ไซต์ที่ไม่มีระบบเดิม ex เป็นศูนย์ ผลจึงเท่ากับก่อนแก้ทุกประการ */
        const bus = pv + ex;
        let bat = 0, grid = 0, exp = 0;
        const surplus = bus - load;
        if (m.bat.cap > 0) {
            if (surplus > 0) { const room = m.bat.cap - soc; const c = Math.min(surplus, cLim, room); soc += c; bat = -c; exp = surplus - c; }
            else { const need = -surplus; const d = Math.min(need, dLim, Math.max(0, soc - m.bat.cap * 0.25)); soc -= d; bat = d; grid = need - d; }
        } else {
            if (surplus > 0) exp = surplus; else grid = -surplus;
        }
        rows.push({ h, pv, ex, bus, load, bat, grid, exp, soc: m.bat.cap > 0 ? soc / m.bat.cap * 100 : 0 });
    }
    return rows;
}

function setHour(h){
    hour = h;
    document.getElementById('hour').value = h;
    if (!M) return;
    const r = M.sim[h], t = T();
    document.getElementById('clock-time').innerText = String(h).padStart(2, '0') + ':00';
    const stKey = r.pv <= 0.05 ? (h >= 17 && M.bat.cap > 0 && r.bat > 0 ? 'eve' : 'night') : (h < 10 ? 'morn' : 'day');
    document.getElementById('clock-state').innerText = t.state[stKey];

    const on = (id, yes, rev) => { const el = document.getElementById(id); if (!el) return;
        el.classList.toggle('on', !!yes); el.classList.toggle('rev', !!rev); };
    on('e-sun', r.pv > 0.05);
    on('e-pv', r.pv > 0.05);
    on('e-house', r.pv > 0.05 || r.bat > 0.05);
    on('e-bat', Math.abs(r.bat) > 0.05, r.bat > 0);   // ชาร์จ = ไหลลง, คาย = ไหลกลับ
    on('e-ex', (r.ex || 0) > 0.05);
    on('e-exp', r.exp > 0.05);
    on('e-imp', r.grid > 0.05);

    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set('kw-pv', fmt(r.pv, 1) + ' kW');
    set('kw-load', fmt(r.load, 1) + ' kW');
    set('kw-ex', (r.ex || 0) > 0.05 ? fmt(r.ex, 1) + ' kW' : '');
    set('kw-soc', M.bat.cap > 0 ? fmt(r.soc, 0) + ' %' : '');
    set('kw-grid', r.grid > 0.05 ? fmt(r.grid, 1) + ' kW' : (r.exp > 0.05 ? '↗ ' + fmt(r.exp, 1) + ' kW' : ''));
    drawDayCursor();
}

function startClock(){
    if (timer) return;
    document.getElementById('btn-play').innerText = '⏸';
    timer = setInterval(() => setHour((hour + 1) % 24), 700);
}
function stopClock(){
    if (!timer) return;
    clearInterval(timer); timer = null;
    document.getElementById('btn-play').innerText = '▶';
}
function togglePlay(){ if (timer) stopClock(); else startClock(); }

/* ── กราฟวันเฉลี่ย 24 ชั่วโมง ──────────────────────────────────── */
function renderDayChart(){
    const t = T(), W = 640, H = 190, P = {l: 34, r: 34, t: 12, b: 22};
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const hasEx = M.sim.some(r => (r.ex || 0) > 0.001);
    const maxKw = Math.max(1, ...M.sim.map(r => Math.max(r.pv, r.ex || 0, r.load, r.grid))) * 1.15;
    const x = h => P.l + h / 23 * iw;
    const y = v => P.t + ih - v / maxKw * ih;
    const ys = v => P.t + ih - v / 100 * ih;
    const line = (key, fn) => M.sim.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + fn(r[key]).toFixed(1)).join('');
    const area = line('pv', y) + `L${x(23)},${y(0)}L${x(0)},${y(0)}Z`;
    const gridLines = [0, .25, .5, .75, 1].map(f =>
        `<line x1="${P.l}" y1="${(P.t + ih - f * ih).toFixed(1)}" x2="${W - P.r}" y2="${(P.t + ih - f * ih).toFixed(1)}" stroke="#DCE3EA" stroke-width="1"/>` +
        `<text x="${P.l - 5}" y="${(P.t + ih - f * ih + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#7A8794" font-family="Kanit">${fmt(maxKw * f, 0)}</text>`).join('');
    const hourTicks = [0, 6, 12, 18, 23].map(h =>
        `<text x="${x(h)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#7A8794" font-family="Kanit">${h}:00</text>`).join('');
    document.getElementById('day-chart').innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" id="day-svg">
        ${gridLines}${hourTicks}
        <path d="${area}" fill="rgba(22,163,74,.16)"/>
        <path d="${line('pv', y)}" stroke="#16A34A" stroke-width="2.2" fill="none"/>
        ${hasEx ? `<path d="${line('ex', y)}" stroke="#0D9488" stroke-width="2" fill="none" stroke-dasharray="6 3"/>` : ''}
        <path d="${line('load', y)}" stroke="#C4432B" stroke-width="2" fill="none"/>
        <path d="${line('grid', y)}" stroke="#6B7A8F" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>
        ${M.bat.cap > 0 ? `<path d="${line('soc', ys)}" stroke="#EC4899" stroke-width="1.8" fill="none" stroke-dasharray="2 4"/>` : ''}
        <line id="day-cursor" x1="${x(hour)}" y1="${P.t}" x2="${x(hour)}" y2="${P.t + ih}" stroke="#3B4C5E" stroke-width="1.4" stroke-dasharray="3 3"/>
      </svg>`;
    document.getElementById('day-svg').dataset.px = JSON.stringify({l: P.l, iw, t: P.t, ih});
    document.getElementById('day-legend').innerHTML =
        `<span><i style="background:#16A34A"></i>${t.legend.pv}</span>` +
        (hasEx ? `<span><i style="background:#0D9488"></i>${t.legend.ex}</span>` : '') +
        `<span><i style="background:#C4432B"></i>${t.legend.load}</span>` +
        `<span><i style="background:#6B7A8F"></i>${t.legend.grid}</span>` +
        (M.bat.cap > 0 ? `<span><i style="background:#EC4899"></i>${t.legend.soc}</span>` : '');
}
function drawDayCursor(){
    const svg = document.getElementById('day-svg');
    if (!svg) return;
    const p = JSON.parse(svg.dataset.px);
    const cx = p.l + hour / 23 * p.iw;
    const c = document.getElementById('day-cursor');
    c.setAttribute('x1', cx); c.setAttribute('x2', cx);
}

/* ── กราฟแท่งรายเดือน ──────────────────────────────────────────── */
function renderMonthChart(){
    const mo = M.monthly;
    if (!mo.length) { document.getElementById('month-chart').innerHTML = ''; return; }
    const W = 1100, H = 220, P = {l: 50, r: 10, t: 14, b: 26};
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const maxE = Math.max(1, ...mo.map(m => m.eGrid || 0)) * 1.12;
    const bw = iw / mo.length * 0.62;
    const bars = mo.map((m, i) => {
        const bx = P.l + iw / mo.length * (i + 0.5) - bw / 2;
        const bh = (m.eGrid || 0) / maxE * ih;
        return `<rect x="${bx.toFixed(1)}" y="${(P.t + ih - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="#1E5A8A"/>` +
               `<text x="${(bx + bw / 2).toFixed(1)}" y="${(P.t + ih - bh - 5).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#3B4C5E" font-family="Kanit">${fmt(m.eGrid)}</text>` +
               `<text x="${(bx + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#7A8794" font-family="Kanit">${m.month || i + 1}</text>`;
    }).join('');
    const gl = [0, .5, 1].map(f =>
        `<line x1="${P.l}" y1="${(P.t + ih - f * ih).toFixed(1)}" x2="${W - P.r}" y2="${(P.t + ih - f * ih).toFixed(1)}" stroke="#DCE3EA"/>` +
        `<text x="${P.l - 6}" y="${(P.t + ih - f * ih + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#7A8794" font-family="Kanit">${fmt(maxE * f)}</text>`).join('');
    document.getElementById('month-chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}">${gl}${bars}</svg>`;
}

/* ── คำอธิบายโหลดอาคาร ─ อ่านจากวันเฉลี่ยของผลจำลองจริง ────────── */
function renderLoadDesc(){
    const el = document.getElementById('load-desc');
    const avg = avgLoad(), peak = Math.max(...M.sim.map(r => r.load));
    if (avg <= 0.05) {
        el.innerText = lang === 'th'
            ? 'ผลจำลองชุดนี้ไม่ได้ระบุโหลดอาคาร (โหมดวิศวกรรม 100% Grid Feed) พลังงานที่ผลิตได้ทั้งหมดจึงถูกคิดเป็นการจ่ายเข้าระบบไฟฟ้า หากต้องการเห็นสัดส่วนใช้เอง ให้รันผลจำลองแบบระบุโหลดในหน้ารายงาน'
            : 'This simulation has no building load (engineering mode, 100% grid feed) — all generated energy is counted as export. Re-run the report simulation with a load profile to see self-consumption.';
        return;
    }
    el.innerText = lang === 'th'
        ? `โหลดอาคารเฉลี่ยประมาณ ${fmt(avg, 2)} kW (สูงสุด ${fmt(peak, 2)} kW) — ช่วงที่เส้นโหลด (สีแดง) อยู่ใต้เส้นผลิต PV (สีเขียว) อาคารใช้ไฟจากแสงอาทิตย์เต็มที่ ส่วนที่ขาดคือไฟที่ซื้อจากการไฟฟ้า (เส้นประสีเทา) หรือดึงจากแบตเตอรี่ (เส้นประสีชมพู)`
        : `Average building load ≈ ${fmt(avg, 2)} kW (peak ${fmt(peak, 2)} kW). Where the red load line sits below the green PV line the building runs on solar; the shortfall is imported from the grid (grey dashes) or drawn from the battery (pink dashes).`;
}

/* ── คำแนะนำในการตัดสินใจลงทุน ─ กติกาง่าย ๆ อ่านจากตัวเลขจริง ── */
function renderAdvice(){
    const th = lang === 'th';
    const items = []; let flag = '';
    const ratio = M.inv.kw > 0 ? M.pnom / M.inv.kw : 0;
    const pb = M.payback;
    const surplusPct = M.eGrid > 0 ? M.surplus / M.eGrid * 100 : 0;

    if (pb && pb <= 6)
        items.push(th ? `ระยะคืนทุนประมาณ ${fmt(pb, 1)} ปี ถือว่าเร็วเมื่อเทียบกับอายุการใช้งานแผงมากกว่า 25 ปี — หลังจุดคืนทุน ค่าไฟที่ประหยัดได้ (ราวปีละ ${fmt(M.y1savings)} บาท) คือผลตอบแทนต่อเนื่อง`
                      : `Payback of about ${fmt(pb, 1)} years is fast against a 25+ year panel life — after that point the ~${fmt(M.y1savings)} THB saved each year is ongoing return`);
    else if (pb)
        items.push(th ? `ระยะคืนทุนประมาณ ${fmt(pb, 1)} ปี — ควรเทียบกับทางเลือกการลงทุนอื่นและแนวโน้มค่าไฟ หากค่าไฟปรับขึ้น ระยะคืนทุนจะสั้นลง`
                      : `Payback of about ${fmt(pb, 1)} years — compare with alternative investments and tariff outlook; rising tariffs shorten it`);
    else
        items.push(th ? 'เงินสะสมยังไม่กลับมาเท่าทุนภายใน 25 ปีตามสมมุติฐานปัจจุบัน ควรทบทวนขนาดระบบ ราคา หรือสมมุติฐานค่าไฟก่อนตัดสินใจ'
                      : 'Cumulative savings do not recover the investment within 25 years under current assumptions — revisit system size, price, or tariff assumptions first');

    if (M.pnom > 0)
        items.push(th ? `ต้นทุนเฉลี่ย ${fmt(M.investment / M.pnom)} บาท/kWp — ใช้ตัวเลขนี้เทียบข้อเสนอจากผู้ติดตั้งรายอื่นในขนาดใกล้เคียงกัน`
                      : `Average cost ${fmt(M.investment / M.pnom)} THB/kWp — use this to benchmark quotes for similar system sizes`);

    if (M.bat.cap > 0)
        items.push(th ? `แบตเตอรี่ ${fmt(M.bat.cap, 1)} kWh ช่วยย้ายไฟกลางวันไปใช้กลางคืนและสำรองไฟยามไฟดับ — ควรกำหนดให้ชัดว่าจะสำรองวงจรจำเป็นใดบ้าง (แสงสว่าง ปั๊มน้ำ สื่อสาร) ให้อยู่ในกำลังจ่าย ${fmt(M.bat.dkw, 1)} kW`
                      : `The ${fmt(M.bat.cap, 1)} kWh battery shifts daytime energy to the night and backs up outages — define which essential circuits stay within its ${fmt(M.bat.dkw, 1)} kW output`);
    else if (surplusPct > 30)
        items.push(th ? `มีไฟส่วนเกินราว ${fmt(M.surplus)} หน่วย/ปี (${fmt(surplusPct)}% ของที่ผลิตได้) — หากไม่มีสัญญาขายไฟ ควรพิจารณาเพิ่มแบตเตอรี่ หรือย้ายการใช้ไฟ (เครื่องทำน้ำร้อน ปั๊ม อัดประจุรถไฟฟ้า) มาไว้ช่วงกลางวันเพื่อให้คุ้มขึ้น`
                      : `About ${fmt(M.surplus)} kWh/y (${fmt(surplusPct)}%) is surplus — without an export agreement, consider adding a battery or shifting loads (water heating, pumps, EV charging) into daytime`);

    if (M.pr < 70 && ratio > 1.3)
        items.push(th ? `PR ${fmt(M.pr, 1)}% ต่ำกว่าระบบทั่วไป สาเหตุหลักคืออินเวอร์เตอร์เล็กกว่าแผงมาก (clipping) ไม่ใช่ความผิดปกติของอุปกรณ์`
                      : `PR of ${fmt(M.pr, 1)}% is below typical systems, mainly due to inverter clipping rather than equipment faults`);
    else if (M.pr < 70)
        items.push(th ? `PR ${fmt(M.pr, 1)}% ต่ำกว่าระบบทั่วไป (75–85%) ควรตรวจการบังเงา ทิศ/มุมเอียงหลังคา และความสะอาดแผงเพิ่มเติม`
                      : `PR of ${fmt(M.pr, 1)}% is below the typical 75–85% — check shading, roof orientation/tilt, and panel soiling`);

    if (ratio > 1.3)
        flag = th ? `DC/AC ratio ${fmt(ratio, 2)} ค่อนข้างสูง — กำลังผลิตช่วงเที่ยงจะถูกจำกัดที่ ${fmt(M.inv.kw, 0)} kW ของอินเวอร์เตอร์ (clipping) ตรวจว่าเป็นการออกแบบที่ตั้งใจ หรือควรเพิ่มขนาด/จำนวนอินเวอร์เตอร์`
                  : `DC/AC ratio ${fmt(ratio, 2)} is high — midday output is clipped at the inverter's ${fmt(M.inv.kw, 0)} kW. Confirm this is intentional or consider more inverter capacity`;

    const tip = th ? 'ตัวเลขทั้งหมดมาจากแบบจำลอง ก่อนตัดสินใจขั้นสุดท้ายควรตรวจบิลค่าไฟจริงย้อนหลัง 12 เดือน พฤติกรรมใช้ไฟรายชั่วโมง สภาพโครงสร้างหลังคา และการขออนุญาตหน่วยงานที่เกี่ยวข้อง (กฟภ./กฟน., อบต./เทศบาล) ให้ครบถ้วน'
                   : 'All figures are simulated — before the final decision, review 12 months of actual bills, hourly usage patterns, roof structure condition, and complete utility/local permits';

    ADVICE = { items: items, flag: flag, tip: tip };
    document.getElementById('advice-list').innerHTML = items.map(i => `<li>${i}</li>`).join('');
    document.getElementById('advice-flag').innerHTML = flag ? `<div class="flag">${flag}</div>` : '';
    document.getElementById('advice-tip').innerHTML = `<div class="tip">${tip}</div>`;
}

function renderFinTable(){
    const t = T(), fin = M.financials;
    if (!fin.length) { document.getElementById('fin-table').innerHTML = ''; return; }
    const head = `<thead><tr>${t.finHead.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
    const body = fin.filter(f => f.y > 0).map(f => {
        const cumCls = f.cum >= 0 ? 'best' : 'neg';
        return `<tr><td>${f.y}</td><td>${fmt(f.energy)}</td><td>${fmt(f.savings)}</td>` +
               `<td>${fmt(f.om)}</td><td>${fmt(f.net)}</td><td class="${cumCls}">${fmt(f.cum)}</td></tr>`;
    }).join('');
    document.getElementById('fin-table').innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
}

/* ══════════════════════════════════════════════════════════════════
   7) เสียงบรรยายสรุประบบ (ใช้เสียงในเครื่อง แบบเดียวกับรายงานตัวอย่าง)
   ══════════════════════════════════════════════════════════════════ */
/* บทบรรยายแบ่งเป็นตอน ๆ ตามหัวข้อบนหน้าจอ
   แยกเป็นข้อความหลายก้อนแทนก้อนเดียว เพราะเสียงจะได้เว้นวรรคระหว่างหัวข้อ
   ฟังแล้วตามทันว่ากำลังพูดถึงส่วนไหนของหน้า */
function narrationSegments(){
    const th = lang === 'th';
    const pb = M.payback ? fmt(M.payback, 1) : null;
    const hasBat = M.bat.cap > 0;
    const hasEx  = !!(M.existing && M.existing.acKw > 0);
    const strip = x => String(x || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();

    let peakPv = 0, peakHour = 12, peakLoad = 0;
    M.sim.forEach(r => {
        if (r.pv > peakPv) { peakPv = r.pv; peakHour = r.h; }
        if (r.load > peakLoad) peakLoad = r.load;
    });
    const avg = avgLoad();
    const segs = [];

    if (th) {
        /* ① ภาพรวมของระบบ */
        let s1 = `ระบบโซลาร์เซลล์โครงการ ${M.name} ขนาดติดตั้ง ${fmt(M.pnom, 2)} กิโลวัตต์ ` +
                 `ใช้แผงจำนวน ${fmt(M.pv.qty)} แผง ผลิตพลังงานได้ประมาณปีละ ${fmt(M.eGrid)} หน่วย `;
        if (hasBat) s1 += `พร้อมแบตเตอรี่ความจุ ${fmt(M.bat.cap, 1)} กิโลวัตต์ชั่วโมง เก็บไฟกลางวันไว้ใช้กลางคืน `;
        if (hasEx) s1 += `ไซต์นี้มีระบบออนกริดเดิมขนาด ${fmt(M.existing.acKw, 1)} กิโลวัตต์อยู่ก่อนแล้ว ` +
                         `ระบบใหม่ต่อพ่วงเข้าทางฝั่งไฟสลับ ตัวเลขความคุ้มค่าที่จะกล่าวถึงคิดเฉพาะส่วนที่เพิ่มขึ้นจากการลงทุนครั้งนี้ `;
        s1 += `เงินลงทุน ${fmt(M.investment)} บาท ` + (pb ? `คาดว่าคืนทุนในเวลาประมาณ ${pb} ปี` : '');
        segs.push(s1);

        /* ② การไหลของพลังงานใน 24 ชั่วโมง */
        segs.push(
            `หัวข้อแรก การไหลของพลังงานใน 24 ชั่วโมง แผนภาพทางซ้ายแสดงเส้นทางของไฟฟ้าในแต่ละชั่วโมง ` +
            `ช่วงกลางวันแผงโซลาร์ผลิตไฟได้สูงสุดประมาณ ${fmt(peakPv, 1)} กิโลวัตต์ ในเวลาราว ${peakHour} นาฬิกา ` +
            `ไฟที่ผลิตได้จะจ่ายให้อาคารก่อนเป็นอันดับแรก ` +
            (hasBat
              ? `ส่วนที่เหลือจะนำไปชาร์จแบตเตอรี่ เมื่อแบตเตอรี่เต็มแล้วจึงส่งออกสู่ระบบของการไฟฟ้า `
              : `ส่วนที่เหลือจะถูกส่งออกสู่ระบบของการไฟฟ้า `) +
            `เมื่อหมดแสงแดด อาคารจะรับไฟจาก` +
            (hasBat ? `แบตเตอรี่ก่อน หากไม่พอจึงซื้อไฟจากการไฟฟ้า ` : `การไฟฟ้าตามปกติ `) +
            (hasEx ? `ทางซ้ายล่างคือระบบออนกริดเดิม ซึ่งจ่ายไฟเข้าบัสเดียวกันกับระบบใหม่ ` +
                     `ไฟที่ระบบเดิมผลิตเกินความต้องการจะถูกเก็บเข้าแบตเตอรี่แทนการไหลย้อนออกไปเปล่า ` : '') +
            `เส้นที่กำลังวิ่งอยู่ในแผนภาพ คือเส้นทางที่มีพลังงานไหลจริงในชั่วโมงนั้น`);

        /* ③ กราฟ */
        segs.push(
            `หัวข้อที่สอง กราฟทางขวาเปรียบเทียบกำลังผลิตกับการใช้ไฟตลอดทั้งวัน ` +
            `เส้นสีเขียวคือกำลังผลิตของแผงโซลาร์ เส้นสีแดงคือโหลดของอาคาร ` +
            (avg > 0.05
              ? `ซึ่งเฉลี่ยอยู่ที่ ${fmt(avg, 1)} กิโลวัตต์ และสูงสุด ${fmt(peakLoad, 1)} กิโลวัตต์ `
              : `ซึ่งผลจำลองชุดนี้ไม่ได้ระบุไว้ เพราะเป็นโหมดวิศวกรรมที่จ่ายไฟเข้าระบบทั้งหมด `) +
            `ช่วงที่เส้นสีเขียวอยู่เหนือเส้นสีแดง คือช่วงที่ระบบผลิตไฟได้มากกว่าที่อาคารใช้ ` +
            `เส้นประสีเทาคือไฟที่ต้องซื้อจากการไฟฟ้า ` +
            (hasBat ? `และเส้นประสีชมพูคือระดับพลังงานที่เหลืออยู่ในแบตเตอรี่ ` : '') +
            `ตลอดทั้งปีระบบผลิตได้ ${fmt(M.eGrid)} หน่วย คิดเป็นค่าประสิทธิภาพระบบ ${fmt(M.pr, 1)} เปอร์เซ็นต์ ` +
            `ส่วนกราฟแท่งด้านล่างคือพลังงานที่ผลิตได้รายเดือน เดือนที่แท่งสูงคือช่วงแดดแรงและกลางวันยาว ` +
            `ส่วนฤดูฝนจะลดลงตามปริมาณเมฆ`);

        /* ④ คำแนะนำในการตัดสินใจลงทุน */
        let s4 = `หัวข้อสุดท้าย คำแนะนำในการตัดสินใจลงทุนติดตั้งระบบ `;
        ADVICE.items.forEach((it, i) => { s4 += `ข้อที่ ${i + 1} ${strip(it)} `; });
        if (ADVICE.flag) s4 += `ข้อควรระวัง ${strip(ADVICE.flag)} `;
        if (ADVICE.tip)  s4 += strip(ADVICE.tip);
        segs.push(s4);
        return segs;
    }

    /* ① Overview */
    let e1 = `The ${M.name} solar system is ${fmt(M.pnom, 2)} kilowatts, using ${fmt(M.pv.qty)} panels, ` +
             `producing about ${fmt(M.eGrid)} units per year. `;
    if (hasBat) e1 += `A ${fmt(M.bat.cap, 1)} kilowatt-hour battery stores daytime energy for the night. `;
    if (hasEx) e1 += `This site already has a ${fmt(M.existing.acKw, 1)} kilowatt on-grid system; the new equipment is AC coupled to it, ` +
                     `so the investment figures cover only the incremental gain. `;
    e1 += `The investment is ${fmt(M.investment)} baht` + (pb ? `, with payback in about ${pb} years.` : '.');
    segs.push(e1);

    /* ② Energy flow */
    segs.push(
        `First, the energy flow across 24 hours. The diagram on the left shows where power travels each hour. ` +
        `During the day the array peaks at about ${fmt(peakPv, 1)} kilowatts, around ${peakHour} o'clock. ` +
        `Generated power serves the building first. ` +
        (hasBat
          ? `The surplus charges the battery, and once the battery is full the rest is exported to the grid. `
          : `Any surplus is exported to the grid. `) +
        `After sunset the building draws from ` +
        (hasBat ? `the battery first, and buys from the grid only when that runs short. ` : `the utility grid. `) +
        (hasEx ? `The lower left is the existing on-grid system, feeding the same AC bus. ` +
                 `Whatever it produces beyond the load now charges the battery instead of being exported for nothing. ` : '') +
        `The animated lines show which paths actually carry power in that hour.`);

    /* ③ Chart */
    segs.push(
        `Second, the chart on the right compares generation against consumption through the day. ` +
        `The green line is PV output and the red line is the building load, ` +
        (avg > 0.05
          ? `averaging ${fmt(avg, 1)} kilowatts and peaking at ${fmt(peakLoad, 1)} kilowatts. `
          : `which this simulation does not define, because it runs in engineering mode feeding everything to the grid. `) +
        `Where the green line sits above the red line, the system generates more than the building uses. ` +
        `The grey dashed line is power imported from the grid` +
        (hasBat ? `, and the pink dashed line is the energy remaining in the battery. ` : `. `) +
        `Across the year the system produces ${fmt(M.eGrid)} units, a performance ratio of ${fmt(M.pr, 1)} percent. ` +
        `The bar chart below shows monthly production: tall bars are the sunny, long-day months, ` +
        `while the rainy season dips with cloud cover.`);

    /* ④ Investment guidance */
    let e4 = `Finally, guidance for the investment decision. `;
    ADVICE.items.forEach((it, i) => { e4 += `Point ${i + 1}. ${strip(it)} `; });
    if (ADVICE.flag) e4 += `A caution: ${strip(ADVICE.flag)} `;
    if (ADVICE.tip)  e4 += strip(ADVICE.tip);
    segs.push(e4);
    return segs;
}
function narration(){ return narrationSegments().join(' '); }

/* ── จังหวะของภาพเคลื่อนไหวระหว่างบรรยาย ────────────────────────────
   ภาพเริ่มเดินหลังเสียงเริ่ม 3 วินาที และหยุดก่อนเสียงจบ 2 วินาที
   speechSynthesis ไม่บอกความยาวเสียงล่วงหน้าและไม่มีเหตุการณ์ "ใกล้จบ"
   จึงประมาณจากจำนวนอักขระ ถ้าเสียงจบเร็วกว่าที่ประมาณไว้ ตัว onend จะหยุด
   ภาพให้เองอยู่แล้ว ภาพจึงไม่มีทางเดินค้างหลังเสียงจบ */
const SPEAK_RATE = 0.92;
const ANIM_START_DELAY_MS = 3000;
const ANIM_STOP_BEFORE_MS = 2000;
let animStartTimer = null, animStopTimer = null, animGuardTimer = null;

function estimateSpeechMs(text){
    const cps = (lang === 'th' ? 11.5 : 14.5) * SPEAK_RATE;   // อักขระต่อวินาทีโดยประมาณ
    return Math.max(4000, text.length / cps * 1000);
}
function clearAnimTimers(){
    clearTimeout(animStartTimer); clearTimeout(animStopTimer); clearTimeout(animGuardTimer);
    animStartTimer = animStopTimer = animGuardTimer = null;
}

/* พูดสรุประบบ คืน Promise ที่จบเมื่อเสียงจบ ใช้ได้ทั้งปุ่มฟังและตอนอัดวิดีโอ */
function speakNarration(opts){
    const autoAnim = !opts || opts.autoAnim !== false;
    return new Promise(resolve => {
        if (!('speechSynthesis' in window)) { resolve(false); return; }
        speechSynthesis.cancel();
        clearAnimTimers();

        const segs = narrationSegments();
        const totalMs = estimateSpeechMs(segs.join(' '));
        const want = lang === 'th' ? 'th' : 'en';
        const voice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(want));
        let done = false;

        const finish = () => {
            if (done) return;
            done = true;
            clearAnimTimers();
            if (autoAnim) stopClock();
            document.getElementById('voice-box').classList.remove('speaking');
            document.getElementById('voice-status').innerText = T().voiceNote;
            resolve(true);
        };

        segs.forEach((text, i) => {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang === 'th' ? 'th-TH' : 'en-US';
            u.rate = SPEAK_RATE;
            if (voice) u.voice = voice;
            if (i === 0) {
                u.onstart = () => {
                    document.getElementById('voice-box').classList.add('speaking');
                    document.getElementById('voice-status').innerText = T().playing;
                    if (!autoAnim) return;
                    setHour(0);
                    animStartTimer = setTimeout(startClock, ANIM_START_DELAY_MS);
                    animStopTimer  = setTimeout(stopClock,
                        Math.max(ANIM_START_DELAY_MS + 1000, totalMs - ANIM_STOP_BEFORE_MS));
                };
            }
            if (i === segs.length - 1) { u.onend = finish; u.onerror = finish; }
            speechSynthesis.speak(u);
        });

        // กันเหนียว เผื่อเสียงบางก้อนหลุดจนไม่มี onend ยิงกลับมา
        animGuardTimer = setTimeout(finish, totalMs + 20000);
    });
}
function speak(){
    if (!('speechSynthesis' in window)) { document.getElementById('voice-status').innerText = T().voiceNo; return; }
    speakNarration();
}
function stopSpeak(){
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    clearAnimTimers();
    stopClock();
    document.getElementById('voice-box').classList.remove('speaking');
    document.getElementById('voice-status').innerText = T().voiceNote;
}

/* ══════════════════════════════════════════════════════════════════
   8) ส่งออกวิดีโอ ─ อัดแอนิเมชันการไหลพลังงานครบ 24 ชั่วโมงเป็น .webm
      วาด SVG ของแผนภาพและกราฟลง canvas ทีละเฟรม แล้วบันทึกด้วย
      MediaRecorder ในเครื่อง ไม่ต้องพึ่งเซิร์ฟเวอร์หรือไลบรารีภายนอก
   ══════════════════════════════════════════════════════════════════ */
/* สไตล์ที่ต้องพกไปกับ SVG ตอนแปลงเป็นภาพ เพราะภาพ SVG มองไม่เห็น CSS ของหน้า */
const VIDEO_SVG_CSS = '.edge{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 8;opacity:.15}' +
    '.edge.on{opacity:1}.node-label{font:500 12.5px Kanit,sans-serif;fill:#12263A}' +
    '.node-sub{font:11px Kanit,sans-serif;fill:#7A8794}.kw{font:600 12px Kanit,sans-serif}';

function svgToImage(svgEl, dashOffset){
    return new Promise(resolve => {
        const clone = svgEl.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        // กำหนดขนาดจริงเป็น 2 เท่าของ viewBox ให้ภาพคมเมื่อขยายลง canvas
        const vb = (clone.getAttribute('viewBox') || '0 0 640 330').split(/\s+/);
        clone.setAttribute('width', parseFloat(vb[2]) * 2);
        clone.setAttribute('height', parseFloat(vb[3]) * 2);
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
        st.textContent = VIDEO_SVG_CSS;
        clone.insertBefore(st, clone.firstChild);
        // ขยับลายเส้นประเองทีละเฟรม แทน CSS animation ที่ไม่ทำงานในภาพนิ่ง
        if (dashOffset != null) clone.querySelectorAll('.edge.on').forEach(e => {
            e.style.strokeDashoffset = (e.classList.contains('rev') ? dashOffset : -dashOffset) + 'px';
        });
        const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' }));
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
    });
}

function drawVideoFrame(ctx, flow, day, h){
    const t = T(), r = M.sim[h];
    ctx.fillStyle = '#F3F6F8'; ctx.fillRect(0, 0, 1280, 720);
    // แถบหัวเรื่อง
    ctx.fillStyle = '#0F1E33'; ctx.fillRect(0, 0, 1280, 92);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#F6C453'; ctx.font = '600 15px Kanit,sans-serif';
    ctx.fillText(t.eyebrow, 28, 34);
    ctx.fillStyle = '#fff'; ctx.font = '600 30px Kanit,sans-serif';
    ctx.fillText(M.name, 28, 72);
    ctx.textAlign = 'right'; ctx.font = '600 44px Kanit,sans-serif';
    ctx.fillStyle = '#F6C453';
    ctx.fillText(String(h).padStart(2, '0') + ':00', 1252, 66);
    ctx.textAlign = 'left';
    // ซ้าย : แผนภาพการไหล + กราฟวันเฉลี่ย
    ctx.fillStyle = '#fff'; ctx.fillRect(16, 108, 764, 596);
    ctx.strokeStyle = '#DCE3EA'; ctx.strokeRect(16.5, 108.5, 763, 595);
    if (flow) ctx.drawImage(flow, 24, 116, 748, 386);
    if (day) ctx.drawImage(day, 24, 500, 748, 200);
    // ขวา : ตัวเลขสำคัญประจำชั่วโมงและของโครงการ
    ctx.fillStyle = '#fff'; ctx.fillRect(796, 108, 468, 596);
    ctx.strokeRect(796.5, 108.5, 467, 595);
    const rows = [
        [t.kwp, fmt(M.pnom, 2) + ' kWp'],
        [t.egrid, fmt(M.eGrid) + ' kWh'],
        [t.pr, fmt(M.pr, 1) + ' %'],
        [t.cost, '฿ ' + fmt(M.investment)],
        [t.payback, M.payback ? fmt(M.payback, 1) + ' ' + t.years : '—'],
        [t.legend.pv.replace(' (kW)', ''), fmt(r.pv, 1) + ' kW'],
        [t.legend.load.replace(' (kW)', ''), fmt(r.load, 1) + ' kW'],
        [t.legend.grid.replace(' (kW)', ''), fmt(r.grid, 1) + ' kW']
    ];
    if (M.bat.cap > 0) rows.push([t.legend.soc.replace(' (%)', ''), fmt(r.soc, 0) + ' %']);
    let y = 158;
    rows.forEach(([label, val]) => {
        ctx.fillStyle = '#7A8794'; ctx.font = '14px Kanit,sans-serif';
        ctx.fillText(label, 822, y);
        ctx.fillStyle = '#12263A'; ctx.font = '600 25px Kanit,sans-serif';
        ctx.fillText(val, 822, y + 30);
        y += 60;
    });
}

let VID_BUSY = false;

/* ปุ่ม Export Video : เปิดหน้าต่างให้เลือกก่อนว่าเอาแบบมีเสียงหรือไม่มีเสียง */
function exportVideo(){
    if (!M || VID_BUSY) return;
    document.getElementById('vid-modal').style.display = '';
}
function closeVidModal(){ document.getElementById('vid-modal').style.display = 'none'; }

/* ── แบบมีเสียงบรรยาย ─ บันทึกหน้าจอ + เสียงระบบของ Windows
   เสียงพูดจาก speechSynthesis ออกทางลำโพงเป็น "เสียงระบบ" เบราว์เซอร์ไม่ให้
   ดึงเข้าไฟล์ตรง ๆ จึงใช้การแชร์หน้าจอทั้งจอพร้อมติ๊กแชร์เสียงระบบแทน ──── */
async function exportVideoWithVoice(){
    if (!M || VID_BUSY) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { alert(T().vmNoSupport); return; }
    let stream = null;
    try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
    } catch (e) { return; }                        // ผู้ใช้กดยกเลิกหน้าต่างแชร์ ไม่ต้องฟ้อง
    VID_BUSY = true;
    const btn = document.getElementById('btn-video');
    const oldHour = hour;
    if (timer) togglePlay();
    try {
        if (stream.getAudioTracks().length === 0 && !confirm(T().vmNoAudio)) return;

        window.scrollTo({ top: 0 });
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
        const chunks = [];
        rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        const done = new Promise(res => rec.onstop = res);
        // ผู้ใช้กด "หยุดแชร์" ของเบราว์เซอร์เอง ก็ปิดการอัดให้เรียบร้อย
        stream.getVideoTracks()[0].addEventListener('ended', () => { try { rec.stop(); } catch (e) {} });
        rec.start();
        btn.innerText = T().vmRec;

        await new Promise(r => setTimeout(r, 800));   // เผื่อเวลาหน้าจอนิ่งก่อนเริ่ม
        // ตัวบรรยายเดินภาพให้เองแล้ว (เริ่มหลังเสียง 3 วินาที หยุดก่อนเสียงจบ 2 วินาที)
        // จึงไม่ต้องมีลูปเดินชั่วโมงซ้อนอีกชุด ซึ่งจะแย่งกันตั้งเวลาบนหน้าจอ
        await speakNarration();
        await new Promise(r => setTimeout(r, 700));

        try { rec.stop(); } catch (e) {}
        await done;

        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (M.name || 'solar').replace(/[\\/:*?"<>|]/g, '_') + '_presentation.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) {
        console.error('บันทึกหน้าจอไม่สำเร็จ', e);
        alert('บันทึกหน้าจอไม่สำเร็จ : ' + e.message);
    } finally {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stopSpeak();
        setHour(oldHour);
        btn.innerText = T().video;
        VID_BUSY = false;
    }
}

/* ── แบบไม่มีเสียง ─ วาดเฟรมลง canvas เองทั้งหมด (แบบเดิม) ─────── */
async function exportVideoSilent(){
    if (!M || VID_BUSY) return;
    const btn = document.getElementById('btn-video');
    if (!('MediaRecorder' in window) || !document.createElement('canvas').captureStream) { alert(T().videoNo); return; }
    VID_BUSY = true;
    const oldHour = hour;
    if (timer) togglePlay();                       // หยุดปุ่มเล่นอัตโนมัติก่อน กันชั่วโมงกระโดดระหว่างอัด
    try {
        const cv = document.createElement('canvas'); cv.width = 1280; cv.height = 720;
        const ctx = cv.getContext('2d');
        const stream = cv.captureStream(30);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
        const chunks = [];
        rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        const done = new Promise(res => rec.onstop = res);
        rec.start();

        const SUB = 4, HOLD = 110;                 // 4 เฟรมย่อยต่อชั่วโมง ≈ วิดีโอยาว 12 วินาที
        for (let h = 0; h < 24; h++) {
            setHour(h);
            btn.innerText = T().videoBusy + (h + 1) + '/24';
            const day = await svgToImage(document.getElementById('day-svg'));
            for (let f = 0; f < SUB; f++) {
                const flow = await svgToImage(document.querySelector('#flow-svg svg'), (h * SUB + f) * 4);
                drawVideoFrame(ctx, flow, day, h);
                await new Promise(rs => setTimeout(rs, HOLD));
            }
        }
        rec.stop(); await done;

        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (M.name || 'solar').replace(/[\\/:*?"<>|]/g, '_') + '_summary.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) {
        console.error('สร้างวิดีโอไม่สำเร็จ', e);
        alert('สร้างวิดีโอไม่สำเร็จ : ' + e.message);
    } finally {
        setHour(oldHour);
        btn.innerText = T().video;
        VID_BUSY = false;
    }
}
