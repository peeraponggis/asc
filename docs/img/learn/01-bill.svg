<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"
     role="img" aria-label="ขั้นที่ 1 วิเคราะห์ค่าไฟจากบิลหรือไฟล์ AMR">
  <title>ขั้นที่ 1 วิเคราะห์ค่าไฟจากบิลหรือไฟล์ AMR</title>
  <style>
    text { font-family: 'Sarabun','Segoe UI',system-ui,sans-serif; }
    .h  { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .s  { font-size: 14px; fill: #64748b; }
    .l  { font-size: 13px; fill: #334155; }
    .ll { font-size: 11.5px; fill: #64748b; }
    .n  { font-size: 13px; font-weight: 700; fill: #fff; }
    .card { fill: #fff; stroke: #e2e8f0; }
    .pulse { animation: p 2.4s ease-in-out infinite; transform-origin: center; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .38 } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
  </style>
  <rect width="960" height="540" rx="14" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <circle cx="46" cy="46" r="19" fill="#2563eb"/>
  <text x="46" y="51" class="n" text-anchor="middle">1</text>
  <text x="76" y="42" class="h" text-anchor="start">วิเคราะห์ค่าไฟ</text>
  <text x="76" y="64" class="s" text-anchor="start">รู้ก่อนว่าลูกค้าใช้ไฟเท่าไร และใช้ตอนไหน</text>
  <rect x="40" y="96" width="250" height="170" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="124" class="l" text-anchor="start">นำเข้าข้อมูล</text>
  <rect x="60" y="138" width="210" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="165" y="155" class="ll" fill="#1e40af" text-anchor="middle">บิลค่าไฟ · กรอกเอง 12 เดือน</text>
  <text x="146" y="182" class="ll" text-anchor="middle">หรือ</text>
  <rect x="60" y="192" width="210" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="165" y="209" class="ll" fill="#1e40af" text-anchor="middle">ไฟล์ AMR จากการไฟฟ้า</text>
  <text x="60" y="240" class="ll" text-anchor="start">AMR ให้ข้อมูลรายชั่วโมง แม่นกว่ามาก</text>
  <path d="M300 180 L340 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="352" y="96" width="268" height="170" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="372" y="122" class="l" text-anchor="start">หน่วยที่ใช้รายเดือน</text>
  <rect x="372" y="186" width="16" height="62" rx="3" fill="#3b82f6"/>
  <rect x="392.5" y="170" width="16" height="78" rx="3" fill="#3b82f6"/>
  <rect x="413" y="156" width="16" height="92" rx="3" fill="#3b82f6"/>
  <rect x="433.5" y="138" width="16" height="110" rx="3" fill="#3b82f6"/>
  <rect x="454" y="144" width="16" height="104" rx="3" fill="#3b82f6"/>
  <rect x="474.5" y="160" width="16" height="88" rx="3" fill="#3b82f6"/>
  <rect x="495" y="152" width="16" height="96" rx="3" fill="#3b82f6"/>
  <rect x="515.5" y="130" width="16" height="118" rx="3" fill="#3b82f6"/>
  <rect x="536" y="148" width="16" height="100" rx="3" fill="#3b82f6"/>
  <rect x="556.5" y="164" width="16" height="84" rx="3" fill="#3b82f6"/>
  <rect x="577" y="176" width="16" height="72" rx="3" fill="#3b82f6"/>
  <rect x="597.5" y="182" width="16" height="66" rx="3" fill="#3b82f6"/>
  <text x="372" y="262" class="ll" text-anchor="start">ม.ค.</text>
  <text x="600" y="262" class="ll" text-anchor="end">ธ.ค.</text>
  <path d="M630 180 L670 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="682" y="96" width="238" height="170" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="702" y="122" class="l" text-anchor="start">สัดส่วนกลางวัน</text>
  <circle cx="801" cy="192" r="56" fill="#e2e8f0"/>
  <path d="M801 192 L801 136 A56 56 0 1 1 757.9 227.7 z" fill="#f59e0b" class="pulse"/>
  <text x="801" y="198" class="l" text-anchor="middle" font-weight="700" font-size="19">64 %</text>
  <text x="702" y="262" class="ll" text-anchor="start">ยิ่งใช้ไฟกลางวันมาก ยิ่งคุ้ม</text>
  <rect x="40" y="292" width="880" height="78" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="64" y="322" class="l" text-anchor="start" font-weight="700" fill="#0f766e">ได้อะไรจากขั้นนี้</text>
  <text x="64" y="348" class="l" text-anchor="start">ค่าไฟต่อหน่วยจริง · ความต้องการใช้ไฟรายชั่วโมง · ขนาดระบบที่เหมาะกับโหลด</text>
  <rect x="40" y="396" width="880" height="108" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="64" y="426" class="l" text-anchor="start" font-weight="700">ส่งออก DB0 ก่อนไปขั้นถัดไป</text>
  <text x="64" y="452" class="l" text-anchor="start">ไฟล์ DB0 พาค่าไฟและรูปแบบการใช้ไฟไปให้ขั้นออกแบบและขั้นรายงานใช้ต่อ</text>
  <text x="64" y="478" class="ll" text-anchor="start">ข้ามขั้นนี้ได้ถ้ายังไม่มีบิล แต่ตัวเลขคืนทุนจะเป็นค่าสมมติ</text>
</svg>
