  <text x="594" y="350" class="l" text-anchor="start" font-weight="700" fill="#166534">PV 480 แผง · 312.00 kWp</text>
  <text x="594" y="370" class="ll" text-anchor="start">ตัวเลขขึ้นสดที่แถบล่างของหน้าจอ</text>
