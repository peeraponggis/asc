  <text x="64" y="444" class="l" text-anchor="start" font-weight="700" fill="#92400e">ภาพดาวเทียมไม่ชัดพอ</text>
  <text x="64" y="470" class="l" text-anchor="start">ใส่คีย์ของตัวเองเพื่อดูภาพลึกกว่าเดิม หรือใช้เครื่องมือตรึงภาพโดรนด้วยจุดควบคุม</text>
  <text x="64" y="492" class="ll" text-anchor="start">ซึ่งให้ความละเอียดสูงกว่าภาพดาวเทียมของทุกเจ้า</text>
