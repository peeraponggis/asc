  <text x="548" y="324" class="l" text-anchor="start">แล้ววางอินเวอร์เตอร์และตู้ไฟตามขนาดจริง</text>
  <rect x="548" y="336" width="350" height="36" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="562" y="359" class="ll" text-anchor="start" fill="#92400e">ขั้นปรับเทียบผนังสำคัญที่สุด ข้ามไปขนาดจะเพี้ยนหมด</text>
  <rect x="40" y="408" width="880" height="96" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="64" y="438" class="l" text-anchor="start" font-weight="700" fill="#92400e">ไฟล์ DB2 รุ่นเก่าจะขึ้นแต่กล่องอาคาร ไม่มีแผง</text>
  <text x="64" y="464" class="l" text-anchor="start">เพราะยังไม่มีขอบเขตหลังคาและตำแหน่งแผงอยู่ในไฟล์ ให้เปิดโครงการในหน้าออกแบบ</text>
  <text x="64" y="486" class="l" text-anchor="start">แล้วส่งออก DB2 ใหม่ หน้าสามมิติจะบอกเองว่าไฟล์ขาดอะไร</text>
