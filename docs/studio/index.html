<!doctype html>
<html lang="th" translate="no" class="notranslate">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto Solar Co-pilot Studio (ASC Studio) — ออกแบบโซลาร์เซลล์ 3D</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" sizes="any" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#146b4a" />
  <!-- หน้านี้แปลเองครบ 3 ภาษา — ห้ามเบราว์เซอร์แปลอัตโนมัติซ้ำ (เคยแปล "Design Auto" เป็น "ออกแบบรถยนต์") -->
  <meta name="google" content="notranslate" />
  <script type="module" crossorigin src="./assets/main-WX-NatU_.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/sldSheet-BVShDrTE.js">
  <link rel="stylesheet" crossorigin href="./assets/sldSheet-BiU0x1JI.css">
  <link rel="stylesheet" crossorigin href="./assets/main-os8AtxTG.css">
  <script src="../supabase-config.js"></script>
  <script src="../asc-cloud.js"></script>
</head>
<body>
  <!-- หน้าจอ E+ (docs/ui-eplus-plan.md): แถบชื่อ → เมนู → แถบเครื่องมือ → พื้นที่ทำงาน → แถบคำสั่ง → แถบสถานะ -->
  <header id="titlebar">
    <svg class="appicon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="1"></rect><path d="M3 12h18M9 7v11M15 7v11M12 2v2M5.6 4.6l1.4 1.4M18.4 4.6 17 6"></path></svg>
    <span class="apptitle" data-i18n="app.title"></span>
    <span class="grow"></span>
    <div class="themeseg" role="group" id="themeSeg"></div>
    <select id="langSel" title="Language"></select>
    <span id="srvDot" class="dot" title="server 11437"></span>
  </header>
  <nav id="menubar" aria-label="menu"></nav>
  <header id="toolbar">
    <div class="tools" id="tools"></div>
  </header>
  <main id="layout">
    <aside id="left">
      <!-- แผงย่อได้ (U4): « = ย่อเป็นแถบแคบตั้ง · คลิกแถบ = กางคืน -->
      <button type="button" class="strip" data-expand="left"><span aria-hidden="true">»</span><span class="vt" data-i18n="pane.left"></span></button>
      <div class="ph"><span data-i18n="pane.left"></span><button type="button" class="pc" data-collapse="left" data-i18n-title="pane.collapse">«</button></div>
      <section class="card" id="summary"></section>
      <section class="card grow"><h3 data-i18n="tree.title"></h3><div id="tree"></div></section>
    </aside>
    <section id="center">
      <div id="viewport"></div>
      <div id="hint" class="hint hidden"></div>
      <div id="editbar" class="editbar"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="viewbar">
        <button data-view="top" data-i18n="view.top"></button>
        <button data-view="iso" data-i18n="view.iso"></button>
        <button id="xrayBtn" data-i18n="view.xray"></button>
        <button id="colorBtn"></button>
        <button id="gridBtn"></button>
        <button id="mountBtn"></button>
        <button id="planesBtn"></button>
        <button id="labelBtn"></button>
        <label class="op"><input id="labelSize" type="range" min="8" max="40" step="1" value="14" /></label>
        <button id="maxBtn"></button>
        <label class="op"><span data-i18n="f.opacity"></span><input id="opacity" type="range" min="0" max="1" step="0.05" value="1" /></label>
        <span id="attrib" class="attrib"></span>
      </div>
    </section>
    <aside id="right">
      <button type="button" class="strip" data-expand="right"><span aria-hidden="true">«</span><span class="vt" data-i18n="insp.title"></span></button>
      <div class="ph"><span data-i18n="insp.title"></span><button type="button" class="pc" data-collapse="right" data-i18n-title="pane.collapse">»</button></div>
      <!-- U7: แท็บ รายละเอียด | SLD ข้างผัง (src/ui/sldPane.ts) -->
      <div class="rtabs" role="tablist"><button type="button" role="tab" data-rtab="insp" aria-selected="true" data-i18n="sldp.insp"></button><button type="button" role="tab" data-rtab="sld" aria-selected="false" data-i18n="sldp.tab"></button></div>
      <section class="card grow" id="inspCard"><div id="inspector"></div></section>
      <section class="card grow hidden" id="sldPane"></section>
    </aside>
    <section id="bottom">
      <div class="tabs">
        <button class="on" data-tab="find"><span data-i18n="find.title"></span> <span id="findBadge" class="badge"></span></button>
        <button data-tab="log" data-i18n="log.title"></button>
      </div>
      <div id="find" class="pane"></div>
      <div id="log" class="pane hidden"></div>
    </section>
  </main>
  <!-- แถบคำสั่ง (พิมพ์/พูด) — สั่งงานทันทีแบบเดิม · ผู้ช่วย AI (U6) ต้องกด Apply -->
  <section id="cmdwrap">
    <form id="cmdbar" autocomplete="off">
      <label for="cmd" class="cmdlbl" data-i18n="cmd.label"></label>
      <input id="cmd" data-i18n-ph="cmd.placeholder" />
      <button type="button" id="micBtn" title="🎙️">🎙️</button>
      <button type="submit" data-i18n="cmd.run"></button>
    </form>
    <div id="cmdStatus" class="cmdstatus"></div>
  </section>
  <footer id="footer" class="statusbar"><span id="footText"></span><div id="zoomBox" class="zoombox" role="group"></div></footer>
  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
  <input type="file" id="filePick" multiple hidden accept=".txt,.json,.geojson,.kml,.dxf,.png,.jpg,.jpeg,.webp,.pgw,.jgw,.wld,.prj" />
</body>
</html>
