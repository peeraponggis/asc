<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAD 2D · ASC Architect</title>
<link rel="icon" href="../favicon.ico?v=0.25.0">
<link rel="stylesheet" href="cad.css?v=0.25.0">
<script src="../mode.js?v=0.25.0"></script>
<link rel="stylesheet" href="../ai/assistant.css?v=0.25.0">
<script src="../brand.js?v=0.25.0"></script>
</head>
<body>
<div class="appbrand" data-brand="line"></div>
<header class="qat">
  <a href="../" class="home" title="กลับหน้าหลัก"><img src="../logo.png?v=0.25.0" alt="" width="24" height="24"></a>
  <button type="button" class="qb" data-cmd="SAVE" title="บันทึก (Ctrl+S)" data-ic="SAVE"></button>
  <button type="button" class="qb" data-cmd="U" title="ย้อน (Ctrl+Z)" data-ic="U"></button>
  <button type="button" class="qb" data-cmd="REDO" title="ทำซ้ำ (Ctrl+Y)" data-ic="REDO"></button>
  <b id="docname" class="docname">CAD 2D</b>
  <button type="button" data-cmd="PARTIAL" id="b-partial" class="partial" hidden title="ไฟล์ใหญ่: เลือก layer/พื้นที่มาแก้เฉพาะส่วน (แบบ Partial Open ของ AutoCAD) · ส่วนอื่นคงเดิมทุกไบต์">✂ แก้บางส่วน</button>
  <span id="saved" class="muted"></span>
  <span class="sp"></span>
  <button type="button" class="qb" data-ui="UI:MOUSE" title="ตั้งค่าเมาส์ / เคอร์เซอร์" data-ic="mouse"></button>
  <button type="button" class="qb" data-ui="UI:KEYS" title="คีย์ลัด (F1)" data-ic="keys"></button>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="ribbon" id="ribbon"></div>
<div class="main">
  <section class="canvaswrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="ucs">Y↑ X→</div>
    <div class="dyn" id="dyn" hidden></div>
  </section>
  <aside class="side">
    <div class="stabs"><button type="button" data-st="sym">สัญลักษณ์</button><button type="button" data-st="props">คุณสมบัติ · Layer</button></div>
    <div id="symdock" class="sbody"></div>
    <div id="propdock" class="sbody" hidden>
      <details open><summary>คุณสมบัติ</summary><div id="props" class="props"></div></details>
      <details open><summary>Layer <button class="mini" id="layer-add" title="เพิ่ม layer">＋</button></summary>
        <input id="layer-q" class="q" placeholder="ค้นหา layer">
        <div id="layers" class="layers"></div></details>
      <details><summary>ข้อมูลไฟล์</summary><div id="info" class="muted small"></div></details>
    </div>
  </aside>
</div>
<footer class="cmdline">
  <div id="history" class="history"></div>
  <div class="cmdrow"><span id="prompt" class="prompt">คำสั่ง:</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="พิมพ์คำสั่ง (L, PL, C, M, CO, RO, WI…) หรือพิกัด x,y · @dx,dy · @ยาว<มุม"></div>
  <div class="status"><span id="coords">0, 0</span>
    <button class="tog" id="t-grid" title="แสดงกริด (F7)">GRID</button><button class="tog" id="t-gsnap" title="จับกริด (F9)">SNAP</button><button class="tog on" id="t-osnap" title="OSNAP (F3)">OSNAP</button><button class="tog" id="t-ortho" title="ORTHO (F8)">ORTHO</button>
    <label class="muted" title="ระยะกริด (มม. จริง)">กริด <select id="grid-mm"><option value="10">10</option><option value="50">50</option><option value="100">100</option><option value="250">250</option><option value="500">500</option><option value="1000">1000</option></select></label>
    <label class="muted">Layer <select id="layer-sel"></select></label>
    <label class="muted" title="สัญลักษณ์แผนผัง (ไฟฟ้า ท่อ เซนเซอร์ เครื่องหมาย) ขยายตามมาตราส่วนนี้ · ประตู เฟอร์นิเจอร์ แผงโซลาร์ เป็นขนาดจริงเสมอ">สัญลักษณ์ <select id="anno">
      <option value="1">1:1 (แบบ SLD บนกระดาษ)</option><option value="20">1:20</option><option value="50">1:50</option><option value="100">1:100</option><option value="200">1:200</option></select></label>
    <span id="units" class="muted"></span><span id="count" class="muted"></span></div>
</footer>
<div id="dlg" class="dlg" hidden><div class="dlg-box">
  <h3 id="dlg-title">เปิดไฟล์ CAD</h3>
  <p id="dlg-note" class="muted small"></p>
  <div id="dlg-body"></div>
  <div class="dlg-foot"><span id="dlg-msg" class="muted small"></span><button id="dlg-close">ปิด</button></div>
</div></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js?v=0.25.0"></script>
<script type="module" src="../ai/assistant.js?v=0.25.0"></script>
</body>
</html>
