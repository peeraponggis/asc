    <!-- ========================================== -->
    <!-- ⚙️ MASTER SHELL LOGIC (ENGINE) ⚙️         -->
    <!-- ========================================== -->
    <script>
        const DB_KEY      = 'proinventive_enterprise_db';
        const SESSION_KEY = 'proinventive_session';
        /* คลังรูปภาพแยกจากฐานข้อมูลหลัก หนึ่งคีย์ต่อหนึ่งโครงการ */
        const IMG_KEY     = id => 'proinventive_images_' + id;

        let currentProjectId   = null;
        let currentProjectData = null;
        let SESSION            = null;

        /* โหมดคลาวด์ ตั้งค่าแล้วหรือยัง ถ้ายัง ทุกอย่างทำงานแบบเดิม (เก็บในเครื่อง) */
        const CLOUD = !!(window.AscCloud && window.AscCloud.enabled);

        /* สิทธิ์ที่มีต่อโครงการนี้ในโหมดคลาวด์ : owner | editor | viewer */
        let myRole = 'owner';
        const canEdit = () => !CLOUD || myRole === 'owner' || myRole === 'editor' || (SESSION && SESSION.isAdmin);

        /* --- 0. ตรวจสิทธิ์ก่อนเข้าใช้งาน --------------------------------- */
        async function requireLogin() {
            if (CLOUD) {
                // ต้องถามเซิร์ฟเวอร์ว่าเซสชันยังใช้ได้จริง ไม่ใช่เชื่อค่าที่ค้างใน sessionStorage
                SESSION = await AscCloud.ready();
                if (!SESSION) { window.location.replace('index.html'); return false; }
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
                return true;
            }

            try { SESSION = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) { SESSION = null; }
            if (!SESSION || !SESSION.username) {
                // ยังไม่ได้เข้าสู่ระบบ ส่งกลับหน้าแรกทันที
                window.location.replace('index.html');
                return false;
            }
            return true;
        }

        function applyUserToHeader() {
            const name = SESSION.display || SESSION.username;
            document.getElementById('user-name').innerText    = name;
            document.getElementById('user-initial').innerText = name.charAt(0).toUpperCase();
            document.getElementById('user-plan').innerText    = SESSION.isAdmin ? 'Administrator' : 'Pro Plan';
        }

        /* --- 1. การจัดการสถาปัตยกรรมข้อมูล (Data Model) & URL Params --- */
        async function initApp() {
            if (!await requireLogin()) return;
            applyUserToHeader();

            const urlParams = new URLSearchParams(window.location.search);
            currentProjectId = urlParams.get('id');

            // ไม่มี ID แนบมา แปลว่าเข้ามาผิดทาง ส่งกลับไปเลือกโปรเจกต์ที่หน้าแรก
            if (!currentProjectId) {
                window.location.replace('index.html');
                return;
            }

            if (CLOUD) await loadProjectFromCloud();
            else       loadProjectFromDB();
        }

        /* --- 2ค. โหลดโครงการจากคลาวด์ ----------------------------------- */
        async function loadProjectFromCloud() {
            showSaveStatus('<i class="fa-solid fa-circle-notch fa-spin text-blue-400 mr-1.5"></i> กำลังโหลดจากคลาวด์...');
            try {
                const p = await AscCloud.getProject(currentProjectId);
                currentProjectData = p.data || { db0: null, db1: null, db2: null, db3: null };

                document.getElementById('project-name').innerText = p.name;
                document.title = p.name + ' — ProInventive';

                // ดูสิทธิ์ของตัวเองในโครงการนี้ เพื่อบอกให้ชัดว่าแก้ได้หรือดูได้อย่างเดียว
                const me = AscCloud.currentUser();
                if (me && p.owner === me.id) myRole = 'owner';
                else {
                    try {
                        const mem = await AscCloud.listMembers(currentProjectId);
                        const mine = mem.find(m => m.userId === (me && me.id));
                        myRole = mine ? mine.role : (SESSION.isAdmin ? 'owner' : 'viewer');
                    } catch (e) { myRole = SESSION.isAdmin ? 'owner' : 'viewer'; }
                }

                if (!canEdit()) showReadOnlyBanner(p);
                showSaveStatus('<i class="fa-solid fa-cloud-arrow-down text-green-400 mr-1.5"></i> โหลดจากคลาวด์สำเร็จ');

                if (currentProjectData.db1 && currentProjectData.db1.step4_validation_results) {
                    updateLiveKwp(currentProjectData.db1.step4_validation_results.totalDcCapacity_kWp);
                }
            } catch (e) {
                console.error(e);
                showSaveStatus('<i class="fa-solid fa-triangle-exclamation text-red-400 mr-1.5"></i> <span class="text-red-300">โหลดไม่สำเร็จ</span>');
                alert('เปิดโครงการไม่สำเร็จ : ' + e.message + '\n\nจะพากลับไปหน้ารายการโครงการ');
                window.location.replace('index.html');
            }
        }

        /* บอกให้เห็นชัดว่าเปิดแบบดูอย่างเดียว ไม่งั้นผู้ใช้จะแก้ไปเรื่อยแล้วงงว่าทำไมไม่ถูกบันทึก */
        function showReadOnlyBanner(p) {
            const bar = document.createElement('div');
            bar.className = 'w-full bg-amber-500 text-white text-xs font-bold px-4 py-1.5 text-center';
            bar.innerHTML = '<i class="fa-solid fa-eye mr-1.5"></i>โหมดดูอย่างเดียว — ' +
                            'คุณถูกเชิญเข้าโครงการนี้ในสิทธิ์ผู้ชม การแก้ไขจะไม่ถูกบันทึก ' +
                            'ติดต่อเจ้าของโครงการหากต้องการสิทธิ์แก้ไข';
            document.body.insertBefore(bar, document.body.firstChild);
        }

        /* --- 2. โหลด Database (จำลอง Backend Integration) --------------- */
        function loadProjectFromDB() {
            let db = null;
            try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) { db = null; }

            if (!db)          db = { user_profile: {}, projects: {} };
            if (!db.projects) db.projects = {};

            // บันทึกผู้ใช้ที่กำลังใช้งานลง user_profile
            db.user_profile = {
                uid : SESSION.username,
                name: SESSION.display || SESSION.username,
                role: SESSION.isAdmin ? 'System Admin' : 'Engineer'
            };

            // ถ้าเป็นโปรเจกต์ใหม่ ให้สร้างโครงสร้างเปล่ารอไว้ พร้อมบันทึกเจ้าของ
            if (!db.projects[currentProjectId]) {
                db.projects[currentProjectId] = {
                    meta: {
                        name: "New Solar Project",
                        owner: SESSION.username,
                        ownerName: SESSION.display || SESSION.username,
                        createdAt: new Date().toISOString(),
                        lastModified: new Date().toISOString()
                    },
                    data: { db0: null, db1: null, db2: null, db3: null }
                };
            }

            // โปรเจกต์เก่าที่ยังไม่มีเจ้าของ ให้ผูกกับผู้ใช้ปัจจุบัน
            const meta = db.projects[currentProjectId].meta;
            if (!meta.owner) { meta.owner = SESSION.username; meta.ownerName = SESSION.display || SESSION.username; }

            try {
                localStorage.setItem(DB_KEY, JSON.stringify(db));
            } catch (e) {
                reportSaveFailure(e);
            }

            // เอารูปที่แยกเก็บไว้กลับมาต่อ ให้ข้อมูลในหน่วยความจำครบเหมือนเดิม
            currentProjectData = restoreStashedImages(currentProjectId, db.projects[currentProjectId].data);

            document.getElementById('project-name').innerText = meta.name;
            document.title = meta.name + ' — ProInventive';

            showSaveStatus('<i class="fa-solid fa-cloud-arrow-down text-green-400 mr-1.5"></i> โหลดข้อมูลสำเร็จ');

            // แสดง kWp ล่าสุดถ้าเคยออกแบบไว้แล้ว
            if (currentProjectData.db1 && currentProjectData.db1.step4_validation_results) {
                updateLiveKwp(currentProjectData.db1.step4_validation_results.totalDcCapacity_kWp);
            }
        }

        /* --- 3. บันทึก Database (Roadmap สู่ Cloud) --------------------- */

        /* แยกรูปหน้าปกออกจากก้อนข้อมูลก่อนเขียนลงฐานข้อมูลหลัก
           วัดจากไฟล์จริง DB3 ขนาด 8.25 MB เป็นรูป base64 เสีย 8.21 MB
           ข้อมูลวิศวกรรมล้วน ๆ มีแค่ 0.04 MB

           ผลที่ได้คือฐานข้อมูลหลักเล็กลงราว 200 เท่า ซึ่งสำคัญเพราะทุกครั้งที่บันทึก
           โค้ดต้องอ่านและเขียนใหม่ทั้งก้อน ต้นทุนจึงโตตามจำนวนโครงการทั้งหมด ไม่ใช่แค่โครงการที่แก้
           รูปยังอยู่ครบในหน่วยความจำและในไฟล์ DB3 ที่ดาวน์โหลด โค้ดส่วนอื่นไม่ต้องรู้เรื่องนี้ */
        const IMG_BUDGET_BYTES = 2 * 1024 * 1024;   // กันไว้ให้รูปไม่เกิน 2 MB จากโควตาราว 5 MB

        function dataForStorage(projectId, data) {
            const st   = data && data.db3 && data.db3.app_state;
            const imgs = st && st.projectImagesBase64;
            if (!Array.isArray(imgs) || imgs.length === 0) return data;

            // ตัวบอกสถานะที่จะเขียนลงฐานข้อมูลแทนตัวรูปจริง
            let mark = { projectImagesBase64: [], _imagesStashed: 0, _imagesDropped: 0 };

            const packed = JSON.stringify(imgs);
            if (packed.length > IMG_BUDGET_BYTES) {
                // รูปความละเอียดเต็มมักใหญ่กว่าโควตาทั้งก้อน ยัดลงไปก็มีแต่จะทำให้บันทึกพังทั้งโครงการ
                // จึงไม่เก็บ แต่รูปยังอยู่ครบในไฟล์ DB3 ที่ดาวน์โหลด ซึ่งเป็นทางกู้คืนจริงอยู่แล้ว
                try { localStorage.removeItem(IMG_KEY(projectId)); } catch (e) {}
                mark._imagesDropped = imgs.length;
                console.warn('รูปหน้าปกรวม ' + (packed.length / 1048576).toFixed(2) +
                             ' MB เกินงบที่กันไว้ จึงไม่เก็บลงฐานข้อมูล (ยังอยู่ในไฟล์ DB3 ที่ดาวน์โหลด)');
            } else {
                try {
                    localStorage.setItem(IMG_KEY(projectId), packed);
                    mark._imagesStashed = imgs.length;
                } catch (e) {
                    // เก็บแยกไม่สำเร็จ ก็อย่าเอากลับไปยัดในก้อนหลัก เดี๋ยวพังทั้งโครงการ
                    try { localStorage.removeItem(IMG_KEY(projectId)); } catch (e2) {}
                    mark._imagesDropped = imgs.length;
                    console.warn('เก็บรูปแยกไม่สำเร็จ จึงข้ามการเก็บรูป', e);
                }
            }

            // คัดลอกแบบตื้นเฉพาะชั้นที่ต้องแก้ ของเดิมในหน่วยความจำไม่ถูกแตะ รูปบนหน้าจอยังครบ
            return Object.assign({}, data, {
                db3: Object.assign({}, data.db3, {
                    app_state: Object.assign({}, st, mark)
                })
            });
        }

        /* เอารูปกลับมาต่อให้ตอนโหลดโครงการ */
        function restoreStashedImages(projectId, data) {
            const st = data && data.db3 && data.db3.app_state;
            if (!st || !st._imagesStashed) return data;
            try {
                st.projectImagesBase64 = JSON.parse(localStorage.getItem(IMG_KEY(projectId))) || [];
            } catch (e) {
                st.projectImagesBase64 = [];
                console.warn('อ่านรูปที่แยกเก็บไว้ไม่สำเร็จ', e);
            }
            return data;
        }

        /* แจ้งผู้ใช้เมื่อเขียนฐานข้อมูลไม่สำเร็จ
           เดิมไม่มีการดักข้อผิดพลาด พอพื้นที่เต็มโค้ดจะหยุดก่อนถึงบรรทัดแจ้งผล
           ผู้ใช้เห็นคำว่า "กำลังบันทึก..." ค้างไว้แล้วเข้าใจว่าบันทึกสำเร็จ ทั้งที่งานหาย */
        function reportSaveFailure(e) {
            const isFull = e && (e.name === 'QuotaExceededError' ||
                                 e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22);
            showSaveStatus('<i class="fa-solid fa-triangle-exclamation text-red-400 mr-1.5"></i>' +
                           '<span class="text-red-300">บันทึกไม่สำเร็จ</span>');
            console.error('เขียนฐานข้อมูลไม่สำเร็จ', e);
            alert(isFull
                ? 'บันทึกไม่สำเร็จ เพราะพื้นที่เก็บข้อมูลของเบราว์เซอร์เต็ม\n\n' +
                  'งานที่ทำอยู่ยังอยู่บนหน้าจอ แต่ยังไม่ได้ถูกบันทึก\n\n' +
                  'ให้ส่งออกไฟล์ DB เก็บไว้ก่อนทันที แล้วลบโครงการเก่าที่ไม่ใช้แล้วออกจากหน้าแรก'
                : 'บันทึกไม่สำเร็จ (' + ((e && e.name) || 'ไม่ทราบสาเหตุ') + ')\n\n' +
                  'งานที่ทำอยู่ยังอยู่บนหน้าจอ แต่ยังไม่ได้ถูกบันทึก\n' +
                  'ให้ส่งออกไฟล์ DB เก็บไว้ก่อน');
        }

        /* --- 3ค. บันทึกขึ้นคลาวด์ ---------------------------------------
           หน่วงไว้เล็กน้อยแล้วรวมการบันทึกที่ติด ๆ กันเป็นครั้งเดียว
           เช่นตอนกดบันทึกที่ส่งทั้ง DB1 และ DB2 มาพร้อมกัน จะได้ไม่ยิงสองรอบ
           รูปจะถูกอัปโหลดเฉพาะตอนที่ชุดรูปเปลี่ยนจริง ไม่ใช่ทุกครั้งที่บันทึก */
        let cloudSaveTimer  = null;
        let cloudSaving     = false;
        let cloudSaveAgain  = false;
        let lastImageStamp  = null;

        function imageStamp(data) {
            const st = data && data.db3 && data.db3.app_state;
            const im = st && st.projectImagesBase64;
            if (!Array.isArray(im) || !im.length) return '0';
            // ใช้จำนวนรูปกับความยาวรวมเป็นลายนิ้วมือ พอแยกได้ว่าเปลี่ยนหรือยังโดยไม่ต้องแฮชทั้งก้อน
            return im.length + ':' + im.reduce((s, x) => s + (x ? x.length : 0), 0);
        }

        function saveProjectToCloud() {
            if (!canEdit()) {
                showSaveStatus('<i class="fa-solid fa-eye text-amber-400 mr-1.5"></i> <span class="text-amber-300">ดูอย่างเดียว ไม่ได้บันทึก</span>');
                return;
            }
            clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(doCloudSave, 600);
        }

        async function doCloudSave() {
            if (cloudSaving) { cloudSaveAgain = true; return; }
            cloudSaving = true;
            showSaveStatus('<i class="fa-solid fa-spinner fa-spin text-blue-400 mr-1.5"></i> กำลังบันทึกขึ้นคลาวด์...');

            const stamp = imageStamp(currentProjectData);
            try {
                await AscCloud.saveProject(currentProjectId,
                    { data: currentProjectData },
                    { skipImages: stamp === lastImageStamp });
                lastImageStamp = stamp;

                showSaveStatus('<i class="fa-solid fa-cloud text-green-400 mr-1.5"></i> บันทึกขึ้นคลาวด์แล้ว: ' +
                    new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.');
            } catch (e) {
                console.error('บันทึกขึ้นคลาวด์ไม่สำเร็จ', e);
                showSaveStatus('<i class="fa-solid fa-triangle-exclamation text-red-400 mr-1.5"></i> ' +
                    '<span class="text-red-300">บันทึกไม่สำเร็จ</span> ' +
                    '<button onclick="doCloudSave()" class="underline">ลองใหม่</button>');
                alert('บันทึกขึ้นคลาวด์ไม่สำเร็จ : ' + e.message +
                      '\n\nงานที่ทำอยู่ยังอยู่บนหน้าจอ อย่าเพิ่งปิดหน้านี้' +
                      '\nให้ตรวจอินเทอร์เน็ตแล้วกด "ลองใหม่" ที่แถบสถานะด้านบน' +
                      '\nหรือส่งออกไฟล์ DB เก็บไว้ก่อนเพื่อความปลอดภัย');
            } finally {
                cloudSaving = false;
                if (cloudSaveAgain) { cloudSaveAgain = false; doCloudSave(); }
            }
        }

        function saveProjectToDB() {
            if (CLOUD) return saveProjectToCloud();

            let db = null;
            try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) { db = null; }
            if (!db || !db.projects || !db.projects[currentProjectId]) return false;

            const toStore = dataForStorage(currentProjectId, currentProjectData);
            db.projects[currentProjectId].data = toStore;
            db.projects[currentProjectId].meta.lastModified = new Date().toISOString();

            // *อนาคต: Firebase.firestore().collection('projects').doc(currentProjectId).set(...)*
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(db));
            } catch (e) {
                reportSaveFailure(e);
                return false;
            }

            const dropped = toStore.db3 && toStore.db3.app_state && toStore.db3.app_state._imagesDropped;
            const timeStr = new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });

            if (dropped) {
                // บอกให้เห็นชัด ๆ ว่ารูปไม่ได้ถูกเก็บ จะได้ไม่เข้าใจผิดว่าเก็บครบแล้ว
                showSaveStatus('<i class="fa-solid fa-cloud text-green-400 mr-1.5"></i> บันทึกล่าสุด: ' + timeStr +
                    ' น. <span class="text-amber-300" title="รูปความละเอียดเต็มใหญ่เกินพื้นที่ของเบราว์เซอร์ ' +
                    'จึงไม่ได้เก็บลงฐานข้อมูล แต่ยังอยู่ครบในไฟล์ DB3 ที่ดาวน์โหลด">' +
                    '· รูป ' + dropped + ' ใบเก็บในไฟล์ DB3 เท่านั้น</span>');
            } else {
                showSaveStatus('<i class="fa-solid fa-cloud text-green-400 mr-1.5"></i> บันทึกล่าสุด: ' + timeStr + ' น.');
            }
            return true;
        }

        function updateLiveKwp(kwp) {
            // ป้ายลอยถูกถอดออกแล้ว เก็บฟังก์ชันไว้เผื่ออนาคตอยากเอากลับมา
            const el = document.getElementById('live-kwp');
            if (!el) return;
            const v = parseFloat(kwp) || 0;
            el.innerHTML = `${v.toFixed(2)} <span class="text-xs font-normal">kWp</span>`;
        }

        /* --- 4. สื่อสารกับ Iframe (Workflow Data Flow) ------------------ */
        window.addEventListener('message', function (event) {
            const data = event.data;
            if (!data || !data.type) return;

            let needSave = false;

            if (data.type === 'EXPORT_DB0') {
                currentProjectData.db0 = data.payload;
                needSave = true;
                console.log('📥 รับ DB0 เรียบร้อย');
            }
            else if (data.type === 'EXPORT_DB1_DB2') {
                currentProjectData.db1 = data.payload.db1;
                currentProjectData.db2 = data.payload.db2;
                needSave = true;
                console.log('📥 รับ DB1 & DB2 เรียบร้อย');

                if (data.payload.db1 && data.payload.db1.step4_validation_results) {
                    updateLiveKwp(data.payload.db1.step4_validation_results.totalDcCapacity_kWp);
                }
            }
            else if (data.type === 'EXPORT_DB3') {
                currentProjectData.db3 = data.payload;
                needSave = true;
                console.log('📥 รับ DB3 เรียบร้อย');
            }
            // หน้าคู่มือขอสลับไปแท็บอื่น
            else if (data.type === 'SWITCH_TAB') {
                if (['manual','pea','asc','model3d','device','report'].includes(data.tab)) switchTab(data.tab);
                return;
            }
            // หน้าลูกขอออกจากระบบ
            else if (data.type === 'REQUEST_EXIT') {
                goToDashboard(true);
                return;
            }
            // หน้าลูกขอข้อมูลผู้ใช้/โปรเจกต์
            else if (data.type === 'REQUEST_SESSION') {
                broadcastToFrames();
                return;
            }

            if (needSave) {
                showSaveStatus('<i class="fa-solid fa-spinner fa-spin text-blue-400 mr-1.5"></i> กำลังบันทึก...');
                saveProjectToDB();
            }
        });

        /* ส่งข้อมูลผู้ใช้และโปรเจกต์ให้หน้าลูกทุกหน้า */
        /* ตัดรูปที่หน้าลูกไม่ได้ใช้ออกก่อนส่งข้ามเฟรม
           asc_3d ใช้แค่รูปแรกเป็นภาพดาวเทียมปูพื้น (parseDB3) ที่เหลือไม่มีใครใช้
           ถ้าส่งทั้งชุด ข้อมูลหลายเมกะไบต์จะถูกคัดลอกซ้ำตามจำนวน iframe ทุกครั้งที่เรียก */
        function slimProjectData() {
            let slim = currentProjectData;
            const st   = slim && slim.db3 && slim.db3.app_state;
            const imgs = st && st.projectImagesBase64;
            if (Array.isArray(imgs) && imgs.length) {
                const first = (typeof imgs[0] === 'string' && imgs[0].length <= IMG_BUDGET_BYTES)
                            ? [imgs[0]] : [];
                if (first.length !== imgs.length) {
                    slim = Object.assign({}, slim, {
                        db3: Object.assign({}, slim.db3, {
                            app_state: Object.assign({}, st, { projectImagesBase64: first })
                        })
                    });
                }
            }
            return slim;
        }

        function broadcastToFrames() {
            // ข้อมูลบริษัทผู้เสนอ กรอกไว้ในหน้า Settings ของ ASC Cloud
            // ส่งไปพร้อมกันเพื่อให้หน้ารายงานและข้อเสนอเอาไปขึ้นหัวเอกสารได้
            // โดยไม่ต้องต่อคลาวด์เอง (asc_report ออกแบบมาให้ทำงานออฟไลน์ได้)
            let company = {};
            try { company = JSON.parse(localStorage.getItem('proinventive_company') || '{}'); } catch (e) {}

            const payload = {
                type: 'SYNC_PROJECT_STATE',
                user: SESSION,
                company: company,
                projectId: currentProjectId,
                payload: slimProjectData()
            };
            ['frame-manual','frame-pea','frame-asc','frame-model3d','frame-device','frame-report'].forEach(id => {
                const f = document.getElementById(id);
                if (f && f.contentWindow) { try { f.contentWindow.postMessage(payload, '*'); } catch (e) {} }
            });
        }

        /* --- 5. UI Control & Tab Switching ----------------------------- */
        function switchTab(tabId) {
            document.querySelectorAll('.nav-step').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            document.querySelectorAll('.workspace-iframe').forEach(frame => frame.classList.remove('active'));
            const activeFrame = document.getElementById(`frame-${tabId}`);
            activeFrame.classList.add('active');

            // (ถอดแถบ Floating Metrics ออกแล้ว — ตัวเลข kWp ดูได้จากแถบสถานะในหน้าออกแบบ)

            try {
                activeFrame.contentWindow.postMessage({
                    type: 'SYNC_PROJECT_STATE',
                    user: SESSION,
                    projectId: currentProjectId,
                    payload: currentProjectData
                }, '*');
            } catch (e) { /* iframe ยังโหลดไม่เสร็จ ข้ามไปก่อน */ }
        }

        function showSaveStatus(htmlContent) {
            document.getElementById('save-status').innerHTML = htmlContent;
        }

        /* --- 6. ปุ่มกลับหน้าแรก: ออกไปที่ index.html เสมอ -------------- */
        async function goToDashboard(skipConfirm) {
            if (!skipConfirm && !confirm('กลับไปหน้ารายการโปรเจกต์ใช่หรือไม่?\nข้อมูลที่กดบันทึกไว้แล้วจะถูกเก็บไว้ตามปกติ')) return;

            // การบันทึกขึ้นคลาวด์ถูกหน่วงไว้ ถ้าออกทันทีงานรอบสุดท้ายจะหาย ต้องส่งให้จบก่อน
            if (CLOUD && (cloudSaveTimer || cloudSaving)) {
                clearTimeout(cloudSaveTimer);
                cloudSaveTimer = null;
                showSaveStatus('<i class="fa-solid fa-spinner fa-spin text-blue-400 mr-1.5"></i> กำลังบันทึกก่อนออก...');
                try { await doCloudSave(); } catch (e) { console.warn(e); }
            }
            window.location.href = 'index.html';
        }

        /* กันปิดแท็บทิ้งระหว่างที่ยังบันทึกไม่เสร็จ */
        window.addEventListener('beforeunload', function (e) {
            if (CLOUD && (cloudSaveTimer || cloudSaving)) { e.preventDefault(); e.returnValue = ''; }
        });

        /* --- 7. เริ่มระบบ ---------------------------------------------- */
        document.addEventListener('DOMContentLoaded', initApp);

        // ส่ง Session ให้หน้าลูกทันทีที่แต่ละ iframe โหลดเสร็จ
        ['frame-manual','frame-pea','frame-asc','frame-model3d','frame-device','frame-report'].forEach(id => {
            const f = document.getElementById(id);
            if (!f) return;
            f.addEventListener('load', function () {
                try { this.contentWindow.document.body.style.backgroundColor = '#ffffff'; } catch (e) {}
                try {
                    this.contentWindow.postMessage({
                        type: 'SYNC_PROJECT_STATE',
                        user: SESSION,
                        projectId: currentProjectId,
                        payload: slimProjectData()
                    }, '*');
                } catch (e) {}
            });
        });
    </script>
</body>
</html>
